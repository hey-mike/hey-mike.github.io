 develop distinct mareting programs\n  - **dimensionality reduction**\n    - It is a commonly used approach in feature preprocessing to remove noise from data, which can also degrade the predictive performance of certain algorithms, and compress the data onto a smaller dimensional subspace while retaining most of the relevant information. \n  - Examples:\n    - Identifying topics in a set of blog posts.\n    - Segmenting customers into groups with similar preferences.\n    - Detecting abnormal access patterns to a website.\n\nunsupervised algorithms are used offten in an explortory setting, when a data scientist wants to understand the data better, rather than as part of a larger automatic system. Another common application for unsupervised algorithms is as a preprocessing step for supervised algorithms.\n\n- reinforcement learning (Solving interactive problems):\n  - The goal is to develop a system (_agent_) that improves its performance based on interactions with the _enviroment_.\n    - _i.e. chess engine_, the agent decides upon a series of moves depending on the state of the board (the enviroment) and reward can be difned as _win_ or _lose_ at the end of the game\n\n## Predictive modeling\n\n- Preprocessing\n  - Feature extraction and scalling\n  - Feature selection\n  - Dimensionality reduction\n  - sampling\n- Learning\n- Evaluation\n- Prediction\n\n## Feature python libaries\n\n- NumPy\n- SciPy\n- scikit-learn\n- pandas\n- matplotlib\n"])</script><script>self.__next_f.push([1,"23:T1e38,"])</script><script>self.__next_f.push([1,"\n## 1. What is a Data-Intensive Application?\n\nModern applications increasingly rely on data, not just computational speed. These are known as **data-intensive applications**—systems where challenges stem from the **volume**, **complexity**, and **speed of change** of the data rather than from CPU constraints.\n\nSuch applications are built from a collection of standard components, each serving a specialized role:\n\n* **Databases**: Persist data so it can be retrieved later.\n* **Caches**: Store the results of expensive computations to improve performance.\n* **Search Indexes**: Enable keyword or filter-based queries over datasets.\n* **Stream Processing**: Handle real-time data through asynchronous message passing.\n* **Batch Processing**: Periodically perform computations over large datasets.\n\nUnderstanding how these pieces interact is key to building scalable, maintainable systems.\n\n## 2. Core System Design Concerns\n\nSuccessful systems share three primary attributes:\n\n### Reliability\n\nA system is reliable if it continues to function correctly even when faced with failures—hardware issues, software bugs, or human mistakes. This means data should not be lost or corrupted, and services should remain available where possible.\n\n### Scalability\n\nScalability is the system's ability to handle growth—whether in user traffic, dataset size, or feature complexity. An ideal system allows you to increase capacity by adding resources, rather than having to re-architect the entire solution.\n\n### Maintainability\n\nAs systems evolve, they must remain easy to understand, debug, and extend. A maintainable system allows many developers to contribute without causing regressions, and adapts to new requirements with minimal disruption.\n\n## 3. OLTP vs OLAP Systems\n![OLTP vs OLAP](//images.ctfassets.net/2swoy9jddxd7/7lGfmdQuVKBGUahccizOp3/23b6109f13fa6a5650447e84db220195/OLTP_vs_OLAP.png)\nData-intensive systems often fall into two categories:\n\n| Property      | Transaction Processing (OLTP)             | Analytic Processing (OLAP)                   |\n| ------------- | ----------------------------------------- | -------------------------------------------- |\n| Read Pattern  | Quick lookup by key (few records)         | Aggregations over large data sets            |\n| Write Pattern | Frequent small writes (e.g., user inputs) | Bulk loads from pipelines or data warehouses |\n| Users         | Customers interacting with applications   | Analysts querying for insights               |\n| Data Focus    | Current application state                 | Historical logs or event trails              |\n| Data Size     | Gigabytes to terabytes                    | Terabytes to petabytes                       |\n\nOLTP systems are designed for real-time responsiveness, while OLAP systems are optimized for high-throughput data analysis.\n\n## 4. Data Encoding and Evolution\n![transformation of data](//images.ctfassets.net/2swoy9jddxd7/7mvyzhutGYrh76iNOQlxNx/ca52d7512822247d70cf579eabfe54c5/transformation_of_data.png)\n\n### In-Memory vs Serialized Data\n\nApplications store data in memory using structures like arrays, maps, or objects for fast access. However, this in-memory form isn't portable across systems.\n\nWhen data is saved to disk or sent over the network, it must be **encoded** (or serialized) into a byte stream. This allows other systems to read or reconstruct it later using **decoding** (or deserialization).\n\n### Encoding Challenges\n\n* **Language Lock-In**: Language-specific serialization (e.g., Java Serialization) makes it hard to integrate with services written in other languages.\n* **Security Vulnerabilities**: Deserializing unknown input can expose systems to arbitrary code execution.\n* **Poor Versioning Support**: Many formats don’t handle forward or backward compatibility, breaking systems when schemas evolve.\n* **Performance Overheads**: Some encoders are bloated or slow, hindering throughput.\n\n### Format Comparisons\n\n* **Language-Specific (e.g., Java Serialization)**: Fast, but tightly coupled and insecure.\n* **Textual (e.g., JSON, XML)**: Human-readable and widely supported, but can be vague about types.\n* **Binary Schema-Driven (e.g., Protobuf, Avro)**: Efficient, compact, and explicitly versioned—ideal for internal service communication.\n\n## 5. Communication Patterns\n\n### RPC (Remote Procedure Call)\n\nRPC aims to abstract away the complexity of calling remote services by making them look like local function calls. However, this abstraction hides several issues:\n\n* **Unpredictability**: Network calls are affected by latency, failures, and timeouts.\n* **Partial Failures**: You might not know whether a request succeeded or failed if the response is lost.\n* **Duplicate Requests**: Retrying on failure can lead to repeated operations without safeguards.\n* **Serialization Overhead**: Complex objects must be encoded and decoded for each call.\n* **Cross-language Challenges**: Data types may not translate cleanly between languages.\n\n### REST vs RPC\n![RPC vs REST](//images.ctfassets.net/2swoy9jddxd7/6SyhnAmk99yeqCEU7tGeKK/34879c7d5b5966adcbca834b188f6f14/RPC_vs_REST.png)\n\nRESTful APIs offer a pragmatic alternative to RPC:\n\n* Easy to test and debug with HTTP tools (like `curl` or Postman).\n* Supported across all major platforms.\n* Large ecosystem of tools (e.g., load balancers, proxies).\n\nCustom RPC with binary formats can be faster, but REST is often preferred for public or heterogeneous systems.\n\n### Message-Passing with Brokers\n![message-passing architecture diagram](//images.ctfassets.net/2swoy9jddxd7/5udUpvprTjbKrS6G3Xw7cH/a3211f1dadb68e6b7d74110affa9dc7f/message-passing_architecture_diagram.png)\n\nMessaging systems like Kafka or RabbitMQ offer an alternative model:\n\n* **Buffering**: Acts as a queue when consumers are slow.\n* **Redelivery**: Handles failures gracefully.\n* **Decoupling**: Publishers don’t need to know consumers.\n* **Scalability**: Enables multiple consumers per message.\n* **Asynchronous Flow**: Send-and-forget communication.\n\n### Distributed Actor Frameworks\n\nActor models (like Akka) treat each component as a stateful actor communicating via messages. This model is naturally scalable and resilient and is suitable for building concurrent, distributed systems.\n\n## 6. Deployment and Evolvability\n\n### Rolling Upgrades\n\nRolling upgrades involve gradually deploying new versions of a service to small subsets of servers:\n\n* Reduce downtime and risk.\n* Enable monitoring and rollback of faulty changes.\n* Promote smaller, frequent deployments.\n\nThis strategy enhances **evolvability**, ensuring the system remains adaptable and continuously deployable.\n\n## 7. Summary of Encoding Format Compatibility\n\n| Format Type          | Interoperability | Human-Readable | Versioning Support | Performance |\n| -------------------- | ---------------- | -------------- | ------------------ | ----------- |\n| Language-Specific    | Low              | No             | Poor               | Good        |\n| JSON/XML/CSV         | High             | Yes            | Medium             | Fair        |\n| Protobuf/Thrift/Avro | High             | No             | Strong             | Excellent   |\n\n## Conclusion\n\nDesigning robust data-intensive applications means making thoughtful decisions about storage, encoding, communication, and deployment.\n\nKey takeaways:\n\n* Use **scalable architecture patterns** to manage data growth.\n* Choose encoding formats that support **interoperability and evolution**.\n* Favor **asynchronous communication** for resilience.\n* Implement **rolling upgrades** to deliver changes safely.\n\nBy embracing these principles, teams can build systems that are reliable under pressure, flexible for future needs, and efficient at scale.\n"])</script><script>self.__next_f.push([1,"24:T7e5d,"])</script><script>self.__next_f.push([1,"## Principles and characteristics\n\n1. No monolithic modules\n2. Dumb communication pipes\n3. Decentralization or self-governance\n4. Service contracts and statelessness\n5. Lightweith\n6. Polylog\n\n## Good parts of microservices\n\n1. self-dependent teams\n2. Graceful degration of services\n3. Supports polygolt architecture and DevOps\n4. Event-driven architecture\n\n## Bad and challenge parts\n\n1. Organization and orchestration\n2. Platform\n3. Testing\n4. Service discovery\n\n## Twelve-factor application\n\n1. **Codebase**: We maintain a single code base here for each microservice, with a configuration specific to their own environments, such as development, QA, and prod. Each microservice would have its own repository in a version control system such as Git, mercurial, and so on.\n2. **Dependencies**: All microservices will have their dependencies as part of the application bundle. In Node.js, there is package.json, which mentions all the development dependencies and overall dependencies. We can even have a private repository from where dependencies will be pulled.\n3. **Configs**: All configurations should be externalized, based on the server environment. There should be a separation of config from code. You can set environment variables in Node.js or use Docker compose to define other variables.\n4. **Backing services**: Any service consumed over the network such as database, I/O operations, messaging queries, SMTP, the cache will be exposed as microservices and using Docker compose and be independent of the application.\n5. **Build, release, and run**: We will use automated tools like Docker and Git in distributed systems. Using Docker we can isolate all the three phases using its push, pull, and run commands.\n6. **Processes**: Microservices designed would be stateless and would share nothing, hence enabling zero fault tolerance and easy scaling. Volumes will be used to persist data thus avoiding data loss.\n7. **Port binding**: Microservices should be autonomous and self-contained. Microservices should embed service listeners as part of service itself. For example— in Node.js application using HTTP module, service network exposing services for handling ports for all processes.\n8. **Concurrency**: Microservices will be scaled out via replication. Microservices are scaled out rather than scaled up. Microservices can be scaled or shrunk based on the flow of workload diversity. Concurrency will be dynamically maintained.\n9. **Disposability**: To maximize the robustness of application with fast startup and graceful shutdown. Various options include restart policies, orchestration using Docker swarm, reverse proxy, and load balancing with service containers.\n10. **Dev/prod parity**: Keep development/production/staging environments exactly alike. Using containerized microservices helps via build once, run anywhere strategy. The same image is deployed across various DevOps stage.\n11. **Logs**: Creating separate microservice for logs for making it centralized, to treat as event streams and send it to frameworks such as elastic stack (ELK).\n12. **Admin processes**: Admin or any management tasks should be packed as one of the processes, so they can be easily executed, monitored, and managed. This will include tasks like database migrations, one-time scripts, fixing bad data, and so on.\n\n## Communication between microservices\n\n### Remote Procedure Invocation (PRI) - Apache Thrift and Google's gRPC\n\nRPI uses binary rather than text to keep the payload very compact and efficient. These requests are multiplexed over a single TCP connection, which can allow multiple concurrent messages to be in flight without having to compromise for network consumption usage.\n\nPros:\n\n1. Request and reply are easy\n2. Simple to maintain as there is no middle broker\n3. Bidirectional streams with HTTP/2-based transportation methods\n4. Efficiently connecting polyglot services in microservices styled architectural ecosystems\n\nCons:\n\n1. The caller needs to know the locations of service instances, that is, maintain a client-side registry and server-side registry\n2. It only supports the request and reply model and has no support for other patterns such as notifications, async responses, the publish/subscribe pattern, publish async responses, streams, and so on\n\n### Messaging and message bus\n\nRoute messages coming from various clients to different microservices destinations. Changes messages to desired transformations as per need. Ability to do message aggregations, segregate a message into multiple messages, and send them to the destination as per need and recompose them. Respond to errors or events. Provide content and routing using the publish-subscribe pattern.\n\nPros:\n\n1. The client is decoupled from the services; they don't need to discover any services. Loosely coupled architecture throughout.\n2. Highly available as the message broker persists messages until the consumer is able to process them for operations.\n3. It has support for a variety of communication patterns, including the widely used request/reply, notifications, async responses, publish-subscribe, and so on.\n\n### Protobufs\n\n**Protocol buffers** or **protobufs** are a binary format created by Google.Some demonstrations effectively show that protobufs is six times faster than JSON.\n\n\u003e Pros:\n\u003e\n\u003e - Formats for protobufs are self-explaining—formal formats.\n\u003e - It has RPC support; you can declare server RPC interfaces as part of protocol files.\n\u003e - It has an option for structure validation. As it has larger datatype messages that are serialized on protobufs, it can be validated automatically by the code that is responsible for exchanging them.\n\n\u003e Cons:\n\u003e\n\u003e - It is an upcoming pattern; hence you won't find many resources or detailed documentation for implementation of protobuf. If you just look for the protobuf tag on Stack Overflow, you will merely see a mere 10,000 questions.\n\u003e - As it's binary format, it's non-readable when compared to JSON, which is simple to read and analyze on the other hand. The next generation of protobuf and flatbuffer is already available now.\n\n## Service discovery\n\n### Service registry for service-service communication\n\n1. `etcd`: A key-value store used for shared configuration and service discovery. Projects such as Kubernates and cloud foundry are based on etcd as it can be highly available, key-value based, and consistent.\n2. `consul`: Yet another tool for service discovery. It has wide options such as exposed API endpoints that allow the client to register and discover services and perform health checks to determine service availability.\n3. `ZooKeeper`: Very widely used, highly available, and a high performant coordinated service used in distributed applications. Originally a subproject of Hadoop, Zookeeper is a widely used top-level project and it comes preconfigured with various frameworks.\n\n#### Server-side discovery\n\nAll requests made to any of the services are routed via a router or load balancers that run in a location known to client interfaces. The router then queries a maintained registry and forwards the request based on the query response\n\nPros:\n\n1. The client does not need to know the location of different microservices. They just need to know the location of the router and the service discovery logic is completely abstracted from the client so there is zero logic at the client end.\n2. Some environments provide this component functionality for free.\n\nCons:\n\n1. It has more network hops, that is, one from the client service registry and another from the service registry microservice.\n2. If the load balancer is not provided by the environment, then it has to be set up and managed. If not properly handled, then it can be a single point of failure.\n3. The selected router or load balancer must support different communication protocols for modes of communication.\n\n### Client-side discovery\n\nUnder this mode of discovery, the client is responsible for handling the network location of available microservices and load balancing incoming requests across them. The client needs to query a service registry (a database of available services maintained on the client side). The client then selects service instances on the basis of an algorithm and then makes a request\nNetflix uses this pattern extensively and has open sourced their tools **Netflix OSS, Netflix Eureka, Netflix Ribbon, and Netflix Prana**. Using this pattern has the following advantages:\n\n1. High performance and availability as there are fewer transition hops, that is, the client just has to invoke the registry and the registry will redirect to the microservice as per their needs.\n2. This pattern is fairly simple and highly resilient as besides the service registry there are no moving parts. As the client knows about available microservices, they can make intelligent decisions easily such as to use a hash, when to trigger auto-scaling, and so on.\n3. **One significant drawback** of using this mode of service discovery is implementation of client-side service discovery logic has to be done in every programming language of the framework that is used by the service clients. For example, Java, JavaScript, Scala, Node.js, Ruby, and so on.\n\n### Registration partterns\n\nWhile using this pattern, any microservice instance is responsible for registering and deregistering itself from the maintained service registry. To maintain health checks, a service instance sends heartbeat requests to prevent its registry from expiring.\n\nPros:\n\n- It couples the service tightly to the self-service registry, which forces us to enable the service registration code in each language we are using in the framework\n- Any microservice that is in running mode, but is not able to handle requests, will often be unaware of which state to pursue, and will often end up forgetting to unregister from the registry\n\n## Data management\n\n### Database per service\n\n- **Private tables/collections per service**: Each microservice has a set of defined tables or collections that can only be accessed by that service\n- **Schema per service**: Each service has a schema that can only be accessed via the microservice it is bound to\n- **Database per service**: Each microservice maintains its own database as per its needs and requirements\n\nPros:\n\n- Loosely coupled services that can stand on their own; changes to one service's datastore won't affect any other services.\n  Each service has the liberty to select the datastore as required.\n- Each microservice has the option of whether to go for relational or non-relational databases as per need. For example, any service that needs intensive search results on text may go for **Solr** or **Elasticsearch**, whereas any service where there is structured data may go for any SQL database.\n\nCons:\n\n- Handling complex scenarios that involve transactions spanning across multiple services. The CAP theorem states that it is impossible to have more than two out of the following three guarantees—consistency, availability, and partitions in the distributed datastore, so transactions are generally avoided.\n- Queries ranging across multiple databases are challenging and resource consuming.\n- The complexity of managing multiple SQL and non-SQL datastores.\n\nTo overcome the drawbacks, the following patterns are used while maintaining a database per service:\n\n- **Sagas**: A saga is defined as a batch sequence of local transactions. Each entry in the batch updates the specified database and moves on by publishing a message or triggering an event for the next entry in the batch to happen. If any entry in the batch fails locally or any business rule is violated, then the saga executes a series of compensating transactions that compensate or undo the changes that were made by the saga batch updates.\n- **API Composition:** This pattern insists that the application should perform the join rather than the database. As an example, a service is dedicated to query composition. So, if we want to fetch monthly product distributions, then we first retrieve the products from the product service and then query the distribution service to return the distribution information of the retrieved products.\n- **Command Query Responsibility Segregation (CQRS)**: The principle of this pattern is to have one or more evolving views, which usually have data coming from various services. Fundamentally, it splits the application into two parts—the command or the operating side and the query or the executor side. It is more of a publisher-subscriber pattern where the command side operates create/update/delete requests and emits events whenever the data changes. The executor side listens for those events and handles those queries by maintaining views that are kept up to date, based on the subscription of events that are emitted by the command or operating side.\n\n## Sharing concerns\n\n- Externalized configuration\n- Observability\n  - Log aggregation\n  - Distributed tracing\n\n## Design patterns\n\n### Asynchronous messaging microservice design patterns\n\nTo successfully implement this design, the following aspects should be considered:\n\n- When you need high scalability, or your current domain is already a message-based domain, then preference should be given to message-based commands over HTTP.\n- Publishing events across microservices, as well as changing the state in the original microservices.\n- Make sure that events are communicated across; mimicking the event would be a very bad design pattern.\n- Maintain the position of the subscriber's consumer to scale up performance.\n  When to make a rest call and when to use a messaging call. As HTTP is a synchronous call, it should be used only when needed.\n\nWhen to use:\n\n- When you want to use real-time streaming, use the Event Firehouse pattern, which has KAFKA as one of its key components.\n- When your complex system is orchestrated in various services, one of the variants of this system, RabbitMQ, is extremely helpful.\n- Often, instead of subscribing to services, directly subscribing to the datastore is advantageous. In such a case use, GemFire or Apache GeoCode following this pattern is helpful\n\nWhen not to use:\n\n- When you have heavy database operations during event transmission, as database calls are synchronous\n- When your services are coupled\n- When you don't have standard ways defined to handle data conflict situations\n\n### backend for frontends\n\nThins to consider:\n\n- A fair consideration of the amount of BFFs to be maintained. A new BFF should only be created when concerns across a generally available service can be separated out for a specific interface.\n- A BFF should only contain client/interface-specific code to avoid code duplication.\n- Divide responsibilities across teams for maintaining BFFs.\n- This should not be confused with a **Shim**, a converter to the convert to interface-specific format required for that type of interface.\n\nWhen to use:\n\n- There are varying differences in a general-purpose backend service across multiple interfaces and there are multiple updates at any point in time in a single interface.\n- You want to optimize a single interface and not disturb the utility across other interfaces.\n- There are various teams, and implement an alternative language for a specific interface and you want to maintain it separately.\n\nWhen not to use:\n\n- Do not use this pattern to handle generic parameter concerns such as authentication, security, or authorization. This would just increase latency.\n- If the cost of deploying an extra service is too high.\n- When interfaces make the same requests and there is not much difference between them.\n- When there is only one interface and support for multiple interfaces is not there, a BFF won't make much sense.\n\n### Gateway aggregation and offloading\n\n**Gateway aggregator**: It receives the client request, then it decides to which different systems it has to dispatch the client request, gets the results, and then aggregates and sends them back to the client. For the client, it is just one request. Overall round trips between client and server are reduced.\n\nThings to consider:\n\n- Do not introduce service coupling, that is, the gateway can exist independently, without other service consumers or service implementers.\n- Here, every microservice will be dependent on the gateway. Hence, the network latency should be as low as possible.\n- Make sure to have multiple instances of the gateway, as only a single instance of the gateway may introduce it as a single point of failure.\n- Each of the requests goes through the gateway. Hence, it should be ensured that gateway has efficient memory and adequate performance, and can be easily scaled to handle the load. Have one round of load testing to make sure that it is able to handle bulk load.\n- Introduce other design patterns such as bulkheads, retry, throttle, and timeout for efficient design.\n- The gateway should handle logic such as the number of retries, waiting for service until.\n- The cache layer should be handled, which can improve performance.\n- The gateway aggregator should be behind the gateway, as the request aggregator will have another. Combining them in a gateway will likely impact the gateway and its functionalities.\n- While using the asynchronous approach, you will find yourself smacked by too many promises of callback hell. Go with the reactive approach, a more declarative style. Reactive programming is prevalent from Java to Node.js to Android. You can check out this link for reactive extensions across different links: https://github.com/reactivex.\n- Business logic should not be there in the gateway.\n\nWhen to use:\n\n- There are multiple microservices across and a client needs to communicate with multiple microservices.\n- Want to reduce the frequent network calls when the client is in lesser range network or cellular network. Breaking it in one request is efficient as then the frontend or the gateway will only have to cache one request.\n- When you want to encapsulate the internal structure or introduce an abstract layer to a large team present in your organization.\n\nWhen not to use:\n\n- When you just want to reduce the network calls. You cannot introduce a whole level of complexity for just that need.\n- The latency by the gateway is too much.\n- You don't have asynchronous options in the gateway. Your system makes too many synchronous calls for operations in the gateway. That would result in a blocking system.\n- Your application can't get rid of coupled services.\n\n### Proxy routing and throttling\n\nWhen you have multiple microservices that you want to expose across a single endpoint and that single endpoint routes to service as per need. This application is helpful when you need to handle imminent transient failures and have a retry loop on a failed operation, thus improve the stability of the application. This pattern is also helpful when you want to handle the consumption of resources used by a microservice.\n\nThis pattern is used to meet the agreed SLAs and handle loads on resources and resource allocation consumption even when an increase in demand places loads on resources:\n\nThings to consider:\n\n- The gateway can be a single point of failure. Proper steps have to be taken to ensure that it has fault tolerant capabilities during development. Also, it should be run in multiple instances.\n- Gateway should have proper memory and resource allocation otherwise it will introduce a bottleneck. Proper load testing should be done to ensure that failures are not cascaded.\n- Routing can be done based on IP, header, port, URL, request parameter, and so on.\n- The retry policy should be crafted very carefully based on the business requirements. It's okay in some places to have a please try again rather than having waiting periods and retrials. The retry policy may also affect the responsiveness of the application.\n- For effective application, this pattern should be combined with **Circuit Breaker Application**.\n- If service is idempotent, then and only then should it be retried. Trying retrial on other services may have unhealthy consequences. For example, if there is a payment service that waits for responses from other payment gateways, the retry component may think it fails and may send another request and the customer gets charged twice.\n- Different exceptions should handle the retry logic accordingly, based on the exceptions.\n- Retry logic should not disturb transaction management. The retry policy should be used accordingly.\n- All failures that trigger a retry should be logged and handled properly for future scenarios.\n- An important point to be considered is this is no replacement for exception handling. The first priority should be given to exceptions always, as they would not introduce an extra layer and add latency.\n- Throttling should be added early in the system as it's difficult to add once the system is implemented; it should be carefully designed.\n- Throttling should be performed quickly. It should be smart enough to detect an increase in activity and react accordingly by taking appropriate measures.\n- Consideration between throttling and auto-scaling should be decided based on business requirements.\n  The requests that are throttled should be effectively placed in a queue based on priority.\n\nWhen to use:\n\n- To ensure that agreed LSAs are maintained.\n- To avoid a single microservice consuming the majority of the pool of resources and avoid resource depletion by a single microservice.\n- To handle sudden bursts in consumption of microservices.\n- To handle transient and short-lived faults.\n\nWhen not to use:\n\n- Throttling shouldn't be used as a means to handle exceptions.\n- When faults are long-lasting. If this pattern is applied in that case, it will severely affect the performance and responsiveness of the application.\n\n### Ambassador and sidecar pattern\n\nThis pattern is used when we want to segregate common connectivity features such as monitoring, logging, routing, security, authentication, authorization, and more. It creates helper services that act as ambassadors and sidecars that do the objective of sending requests on behalf of a service. It is just another proxy that is located outside of the process. Specialized teams can work on it and let other people not worry about it so as to provide encapsulation and isolation. It also allows the application to be composed of multiple frameworks and technologies.\n\nThings to consider:\n\n- The ambassador can introduce some latency. Deep thought should be given on whether to use a proxy or expose common functionalities as the library.\n- Adding generalized functionalities in ambassador and sidecar is beneficial, but is it required for all scenarios? For example, consider the number of retries to a service, it might not be common for all use cases.\n- The language or framework in which ambassador and sidecar will be built, managed, and deployed strategy for it. The decision to create single or multiple instances of it based on need.\n- Flexibility to pass some parameters from service to ambassador and proxy and vice versa.\n- The deployment pattern: this is well suited when the ambassador and sidecar are deployed in containers.\n- The inter-micro service communication pattern should be such that it is framework agnostic or language agnostic. This would be beneficial in the long run.\n\nWhen to use:\n\n- When there are multiple frameworks and languages involved and you need a common set of general features such as client connectivity, logging, and so on throughout the application. An ambassador and sidecar can be consumed by any service across the application.\n- Services are owned by different teams or different organizations.\n- You need independent services for handling this cross-cutting functionality and they can be maintained independently.\n- When your team is huge and you want specialized teams to handle, manage, and maintain core cross-cutting functionalities.\n- You need to support the latest connectivity options in a legacy application or an application that is difficult to change.\n- You want to monitor resource consumption across the application and cut off a microservice if its resource consumption is huge.-\n\nWhen not to use\n\n- When network latency is utmost. Introducing a proxy layer would introduce some overhead that will create a slight delay, which may not be good for real-time scenarios.\n- When connectivity features cannot be generalized and require another level of integration and dependency with another service.\n- When creating a client library and distributing it to the microservices development team as a package.\n- For small applications where introducing an extra layer is actually an overhead.\n- When some services need to scale independently; if so, then the better alternative would be to deploy it separately and independently.\n\n### Anti-corruption microservice design pattern\n\nThis design provides an easy solution for this by introducing a facade between modern and legacy applications. This design pattern ensures that the design of an application is not hampered or blocked by legacy system dependencies:\n\nThings to consider:\n\n- The ACL should be properly scaled and given a better resources pool, as it will add latency to calls made between two systems.\n- Make sure that the corruption layer you introduce is actually an improvement and you don't introduce yet another layer of corruption.\n- The ACL adds an extra service; hence it must be effectively managed and maintained and scaled.\n- Effectively decide the number of ACLs. There can be many reasons to introduce an ACL—a means to translate undesirable formats of the object in required formats means to communicate between different languages, and so on.\n- Effective measures to make sure that transactions and data consistency are maintained between both systems and can be monitored.\n- The duration of the ACL, will it be permanent, how will the communication be handled.\n- While an ACL should successfully handle exceptions from the corruption layer, it should not completely, otherwise it would be very difficult to preserve any information about the original error.\n\nWhen to use:\n\n- There is a huge system up for refactoring from monolithic to microservices and there is a phase-by-phase migration planned instead of the big bang migration wherein the legacy system and new system need to coexist and communicate with each other.\n- If the system that you are undertaking is dealing with any data source whose model is undesirable or not in sync with the needed model, this pattern can be introduced and it will do the task of translating from undesirable formats to needed formats.\n- Whenever there is a need to link two bounded contexts, that is, a system is developed by someone else entirely and there is very little understanding of it, this pattern can be introduced as a link between systems.\n\nWhen not to use:\n\n- There are no major differences between new and legacy systems. The new system can coexist without the legacy system.\n- You have lots of transactional operations and maintaining data consistency between the ACL and the corrupt layer adds too much latency. In such case, this pattern can be merged with other patterns.\n- Your organization doesn't have extra teams to maintain and scale the ACL as and when needed.\n\n### Bulkhead design pattern\n\nSeparate out different services in the microservices application into various pools such that if one of the services fails, the others will continue to function irrespective of failure.\n\nThings to consider:\n\n- Define proper independent partitions in the application based on business and technical requirements.\n- Bulkheads can be introduced in forms of thread pools and processes. Decide which one is suitable for your application.\n- Isolation in the deployment of your microservices.\n\nWhen to use:\n\n- The application is huge and you want to protect it from cascading or spreading failures\n- You can isolate critical services from standard services and you can allocate separate pools for them\n\nWhen not to use:\n\n- When you don't have that much budget for maintaining separate overheads in terms of cost and management\n- The added level of complexity of maintaining separate pools is not necessary\n- Your resources usage is unexpected and you can't isolate your tenants and keep a limit on it as it is not acceptable when you would place several tenants in one partition\n\n### Circuit breaker\n\nServices sometimes need to collaborate with each other when they need to handle requests. In such cases, there is a very high scenario that the other service is not available, is showing high latency, or is unusable. This pattern essentially solves this issue by introducing a breakage in the circuit that stops propagation in the whole architecture:\n\nThings to consider:\n\n1. Since you are invoking a remote call, and there may be many remote call invocation asynchronous and reactive principles for using future, promises, async, and await is must.\n2. Maintain a queue of requests; when your queue is overcrowded, you can easily trip the circuit. Always monitor the circuit, as you will often need to activate it again for an efficient system. So, have a mechanism ready for reset and failure handlers.\n3. You have a persistent storage and network cache such as **Memcache** or **Redis** to record availability.\n4. Logging, exception handling, and relaying failed requests.\n\nWhen to use:\n\n- When you don't want your resources to be depleted, that is, an action that is doomed to fail shouldn't be tried until it is fixed. You can use it to check the availability of external services.\n- When you can compromise a bit on performance, but want to gain high availability of the system and not deplete resources.\n\nWhen not to use:\n\n- You don't have an efficient cache layer that monitors and maintains states of services for a given time for requests across the clustered nodes.\n- For handling in-memory structures or as the substitute for handling exceptions in business logic. This would add overhead to performance.\n\n#### Strangler pattern\n\nThis pattern is about eventually migrating a legacy system by incrementally replacing particular parts of functionality with new microservices application and services. It eventually introduces a proxy that redirects either to the legacy or the new microservices, until the migration is complete and at the end, you can shut off the strangler or the proxy:\n\n- **Reconstruct**: Construct a new application or site (in serverless or AWS cloud-based on modern principles). Incrementally reconstruct the functionalities in an agile manner.\n- **Coexist**: Leave the legacy application as it is. Introduce a facade that eventually acts as a proxy and decides where to route the request based on the current migration status. This facade can be introduced at web server level or programming level based on various parameters such as IP address, user agent, or cookies.\n- **Terminate**: Redirect everything to the modern migrated application and loosen off all the ties with the legacy application.\n\nThings to consider:\n\n- The facade or the proxy needs to be updated with the migration.\n- The facade or the proxy shouldn't be a single point of failure or bottleneck.\n- When the migration is complete, facade will evolve as the adapter for legacy applications.\n- The new code written should be such that it can easily be intercepted, so in future, we can replace it in future migrations.\n\nWhen to use:\n\n- When you want to follow the test-driven on behavior-driven development, and run fast and comprehensive tests with the accessibility of code coverages and adapt CI/CD.\n- Your application can be contained bounded contexts within which a model applies in the region. As an example, in a shopping cart application, the product module would be one context.\n\nWhen not to use:\n\n- When you are not able to intercept the user agent request, or you are not able to introduce a facade in your architecture.\n- When you think of doing a page by page migration at a time or you are thinking of doing it all at once.\n- When your application is more frontend-driven; that's where you have to entirely change and rework the interacting framework based on the way the frontend is interacting with services, as you don't want to expose the various ways the user agent is interacting with services.\n"])</script><script>self.__next_f.push([1,"25:T445b,"])</script><script>self.__next_f.push([1,"## Domain-drive design\n\nIt is very important to note that OOP is not only inheritance, interfaces, or anything else of the type. OOP's main ideas are as follows:\n\n- Code alignment with the business\n- Favoring of reuse\n- Minimal coupling\n\nthree are more prominent for efficient microservices:\n\n- Context maps: These are the communication paths between microservices with appropriate interactions between microservices teams. After the analysis of the areas are already defined, the team can choose to be dependent on another team for domain language.\n- Anti-corruption layer (ACL): This is the function that translates foreign concepts for an internal model to provide loose coupling between the domains.\n- Interchange context: This provides an environment for both teams and discusses the meaning of each foreign term and translates the languages of microservices.\n\n## Independent deploy, update, scale and replace\n\n### Update\n\n- Never share libraries between microservices\n- Strong delimitation of microservice domains\n- Establish a client-server relationship between microservices\n- Deploy in separate containers\n\n### Scale\n\n**The Scale Cube**: 3 axis\n\n- x-axis: horizontal decomposition: with the same application server replicated n times in full and in a balanced order of 1/n.\n- y-axis: functional decomposition: a verb or route is used by the balancer to identify where to go with the request.\n- z-axis: data partitioning: is very similar to the x-axis when it comes to scalability structure, as it distributes exactly the same code on each server. The big difference is that each server responds to a specific subset of data\n\n## Communication\n\n|              |       One-to-One        |             One-to-Many |\n| ------------ | :---------------------: | ----------------------: |\n| Synchronous  |    Request/response     |                       - |\n| Asynchronous |      Notification       |        publish/subsribe |\n|              | Request/ async response | publish/async responses |\n\n### Synchronous\n\n- HTTP\n- TCP\n- WebSockets\n- Sockets\n- RPC\n- SOAP\n\n### Asynchronous\n\nFor this approach, the message broker is just perfect. Some software applications appear a good choice for message brokers, such as RabbitMQ, ActiveMQ, ZeroMQ, Kafka, and Redis. Each of these options has its own peculiarities, some are faster, others are more resilient. Again, the business setting is going to determine which technology is used.\n\n### Mobile vs web endpoints\n\nProblems such as speed and weight information in the web world are not very common; we cannot say the same for the mobile world.\n\n### Caching at the client level\n\nrequest only passes to be processed on the backend, if really necessary. In other words, it tries to block direct access to the backend to requests that have already been implemented in the recent past.\n\n### Throttling for your client\n\n- Number of requests per minute from the same client\n- Number of requests per second from the same client\n- Number of requests per minute from the same client for similar information\n- Number of requests per second for the same client for the same information\n\n### Identification of an anemic domain\n\n- The microservice cannot perform the tasks itself with only the data received\n- The microservice needs to fetch data in more than one endpoint to perform a task\n- The microservice does not have a self-sufficient entity model\n- The microservice waits for the completion of a task in another microservice to follow up what you need to do\n- The microservice needs to share resources with other external microservices; these resources can be cached to the sample database\n\nIf the microservice being developed is one of those items, then it can be a weak area. If a microservice has two or more characteristics of those listed, then it is definitely an anemic domain.\n\nAnemic domains are very harmful to the microservices ecosystem, because they have a tendency to be multiplied in order to correct the technical debt generated by the deficiency in the composition of their respective domains.\n\n### Fat domain - AAA (Authentication, Authorization, and Accounting\n\nThe division of this fat domain can be held in two parts; the first part is AAAService and the second is UserService. Another approach is the AAA responsibility for a gateway API. The functional scalability and features of implementation with these separate domains is much more interesting for the growth of the product as a whol\n\n## Things to consider\n\nCost and scability:\n\n- Programming languages\n- Microservices frameworks\n- Binary communication\n- Message broker\n- Caching tools\n- Fail alert tools\n- Locale proof performance\n\n## Death Start\n\nThe Death Star is an anti-pattern where there is communication between the recursion microservices, and making progress becomes extremely complicated or expensive for a product.\n\n## Message broker - Async communication between services\n\nwhy not use this messaging for all types of communication between microservices?\n\nThe answer to this question is quite simple. A message bus is a physical component within the stack of microservices. It needs to be scaled just like any other physical component-based data storage and cache. This means that with a high-volume message, the synchronous mode of communication could be committed to an unwanted delay in the responses of the processes.\n\n### Tools\n\n- ActiveMQ\n- RabbitMQ\n- Kafka\n\n#### Caching tools\n\n- Memcached\n  classic process of using cache, Memcached is simple and practical to use. The performance of Memcached is fully linked to the use of memory. If Memcached uses the disc to register any data, the performance is seriously compromised; moreover, Memcached does not have any record of disk capacity and always depends on third-party tools for this.\n- Redis\n\n#### Fail alert tools\n\nfour major points of failure when it comes to microservices\n\n- Performance - New Relic and Datadog\n- Build - Jenkins, Travis\n- Components - Nagios and Zabbix are also very useful for making aid work to health check endpoints.\n- Implementation failures - Sentry\n  - See the impact of new deployments in real time\n  - Provide support to specific users interrupted by an error\n  - Detect and thwart fraud as it's attempted: unusual amounts of failures on purchases, authentication, and other critical areas\n  - External integrations\n\n### Locale proof performance\n\n- Apache Benchmark\n- WRK\n- Locust\n\n## Internal Patterns\n\n- Developing the structure\n- Caching strategies\n- CQRS – query strategy\n- Event sourcing – data integrity\n\n## CQRS(Command Query Responsibility Segregation)\n\nAs the name implies, it is about separating the responsibility of writing and reading of data. CQRS is a code pattern and not an architectural pattern.\n\n`Will just scaling the application servers solve all our problems?`\n\n- Deadlocks, timeouts, and slowness mean that your database may be in too much demand.\n- Complex queries can be performed to obtain database data. ORMs can add even more complexity to the data filtering process by mapping entities and filtering data by using joins in different tables.\n- Content obsolescence could be true\n\nThe CQRS teaches us the division of responsibility for writing and reading data, both conceptual and using different physical storages. This means that there will be separate means for recording and retrieving data from the databases. Queries are done synchronously in a separate denormalized database, and writes asynchronously to a normalized database. Caching first is still a type of CQRS implementation at the conceptual level.\n\n**Command** will be responsible for modifying the state of the data in the application, **Query** is the operation responsible for retrieving information from the database.\n\n**Synchronization**: The following are some strategies to keep the foundations of reading and recording synchronized, and it is necessary to choose the one that best meets your scenario:\n\n- Automatic updating: All changes in the state of a given recording database raise a synchronous process to update on the bench\n- Update possible: All state changes of a given recording database trigger an asynchronous process to update the reading bank, offering an eventual data consistency\n- Controlled update: A regular process and schedule is raised to synchronize the databases\n- Update on demand: Every query checks the consistency of the read base compared to the recording, and forces an update if it is out of date\n\nAny update is one of the most used strategies, because it assumes that any given displayed data may already be out of date, so it is not necessary to impose a synchronous update process.\n\n**Queueing**: Many CQRS implementations may require a message broker for the processing of commands and events.\n\n## Event sourcing – data integrity\n\n- Each change in the current state of your database would be a new event in a stream that only allows inclusion.\n- Each update on the table would generate a new line, the change of status\n- uses the append only model for database records\n\n## Aggregator Microservice Design Pattern\n\nBest practices:\n\n- Segregated database: This allows us to better scale our application, especially in the data storage layer.\n- Microservice encapsulation: This divides the microservices into two layers—Public Facing Services and Internal Services. Such a division allows for greater flexibility with respect to the signature microservices, as Internal Services can be modified more easily.\n- Applied CQRS: With CQRS, unnecessary stress points on the application were removed.\n- Applied event sourcing: With event sourcing, we are conducting a stream of information from a news article. This gives us a real vision of the history of each news article.\n- Applied pattern very scalable: With a strong pattern and understanding of how to scale the aggregator pattern, we have a clear vision of how to avoid anti-patterns.\n\nPros:\n\n- Scalability of both the x-axis and z-axis\n- Tunneling microservices\n- Microservices signature flexibility to Internal Services\n- Providing a single access point for microservices\n\nCons:\n\n- Complexity to orchestrate data\n- Bottleneck anti-pattern\n- Latency in communication between microservices\n\n## Proxy design pattern\n\n- Dumb proxy - the only goal is to provide a single endpoint to facilitate the application clients and encapsulate direct access to the routes of microservices.\n- Smart proxy - The most commonly seen task being executed by a Smart proxy is the content modification.\n\nPros:\n\n- Practical data consumption by the application clients\n- Ease of implementation\n- Possibility of good programming techniques at proxy level, such as caching\n- Encapsulation of access to microservices\n- Control and diversion of requests\n\nCons:\n\n- Bottleneck\n- Inappropriate change of response\n- Obstruction in the identification of overload\n\n## Chained Microservice Design pattern\n\n**Big Ball of Mud Anti-patern**:developing microservices that we do not define well in the domains, which makes microservices dependent on one another to complete trivial tasks. This type of error generates a series of unnecessary calls between the microservices, creating complex problems of being corrected, such as latency and, in the worst cases, cyclic-deployed dependency.\n\nMain characteristics:\n\n- **Poorly defined domain**: The domain is badly defined, forcing a direct connection with other microservices. Access points to the microservice do not require enough data to process a task, which forces the inference of data, searching in other microservices.\n- **Mandatory direct communication**: When direct communication between microservices is mandatory for most tasks or for all tasks, there is a problem. This indicates that the microservice is anemic or that the application as a whole is poorly developed.\n- **Deploy clustered**: When a microservice cannot be sent for production because it needs another microservice all together, or when the change of internal signatures of a microservice causes others to collapse, there is a Death Star anti-pattern issue. Creating business dependencies between microservices means that processes are not automated and fluid.\n\n_Solution_:\nCorrelation ID: A simple way to implement correlation ID using HTTP would be to send a UUID in the header of the requests and use this UUID as an identifier to write the logs.\n\n### Purest microservices\n\nThe microservices in your business design should be pure. This means that a microservice must be extremely small in its domain and fully capable of performing its function without outside interference from other microservices.\n\nPros:\n\n- Practical implementation\n- Dynamism for business\n- Independent scalability\n- Encapsulation of access to microservices\n\nCons:\n\n- The possibility of latency points\n- The difficulty in understanding data ownership\n- The difficulty of debugging\n\n## Branch Microservice Design Pattern\n\nRules:\n\n- The composition of the response using direct call chains cannot extend one direct call to another microservice\n- If more values are required for the response, an aggregation logic is created that will trigger concurrent requests for as many chains as needed\n\nInternal communication within a microservice can be worked on in the following three ways:\n\n- Sequential: No concurrency or parallelism. This means that when we have to send messages from the commands to the microservices, the entire process will be a sequence. If you need to execute four commands to compose the data, all of them will be executed in a sequence.\n- Threads: In this case, both POSIX threads (pthreads) and green threads can be used. Controlling threads is often not simple for developers, and if a thread fails, data orchestration could be compromised. However, it is the most practical way because there is no need for any external components of the programming language to be used for creating some level of competition or parallelism in the execution of the commands.\n- Message Broker: The use of a transactional message broker for transmitting sensitive data within a microservice is quite usual. The disadvantage is the addition of a physical component within a microservice. However, the advantage is the ability to execute strategies that offer more resiliency in data transmission. The simple fact of working with transactions is already a great resource.\n\nPros:\n\n- The flexibility of implementation\n- Independent scalability\n- Encapsulation of access to microservices\n- Compositional ability and orchestration\n\nCons:\n\n- The possibility of latency points\n- The difficulty in understanding data ownership\n- The difficulty of debugging\n\n## Asynchronous messaing design pattern\n\nPros:\n\n- Independent scalability\n- Extreme scalability\n- Lazy processing\n- Encapsulation of accesses to microservices\n\nCons:\n\n- Complexity in the monitoring of requisitions\n- Complexity of the initial understanding of the pattern\n- Difficulty of debugging\n\n## replese piplelines\n\nBuild -\u003e Unit Test -\u003e Integration Test -\u003e End-to-End test -\u003e realse\n\n## Monitoring a single service\n\n- `Active Monitoring`is when the server that is to be monitored sends the status information to the monitoring tool\n- `Passive Monitoring` is when the monitoring tool requests information about the state of the machine or application from the server\n\n## Multiple service instances per host\n\n**Pros**\nOne of the key benefits is that it uses resources efficiently. Multiple instances of the service share the server and its operating system. Another benefit of this pattern is the relatively rapid deployment of a microservice instance.\n\n**Cons**\nA major disadvantage is that there is little to no isolation of instances of the service unless each service instance is a separate process. If the instances are not separated in different processes, an instance with errors could compromise the entire process, besides making the individual monitoring of instances impossible.\n\n## Service instance per host\n\n- Service instance per VM: Each instance of a microservice is a VM, and the execution of this VM enables the microservice to work.\n\n  - Pros: One of the main benefits of VMs is that each instance of microservice runs in a completely isolated manner, having fixed CPU and memory consumption, without competing for resource consumption with other microservices. Another great benefit of this pattern is the encapsulation of the technology used in the development of microservices.\n  - Cons: Each service instance has the overhead of a full VM, including the operating system. Another disadvantage of this approach is that deploying and booting a new version of a microservice is often slow because the cost of booting operating systems using VMs can be high.\n\n- Service instance per container: each microservice instance runs in a container unique to the instance.\n  - Pros: They isolate their instances of microservices from one another. Containers are easily monitored. In addition, similar to the VMs, the containers encapsulate the technology used to implement microservices. Unlike the virtual machines, the containers are lighter. The container images are usually very fast to build and initialize.\n  - Cons: There are some disadvantages to using containers. Containers are not as secure as VMs because they share the host operating system kernel with each other.Another disadvantage of the containers is the complexity of the infrastructure if they are not using any cloud platform that offers interesting mechanisms to manipulate the containers.\n"])</script><script>self.__next_f.push([1,"26:T18f5,"])</script><script>self.__next_f.push([1,"\n## Introduction\n\nAuthentication is fundamental to securing modern web applications. Developers often choose between **session-based** and **token-based** approaches, depending on their app architecture and scalability needs. This guide explores these two models, compares storage options, explains common pitfalls, and provides best practices for implementation.\n\n---\n\n## 1. Session-Based Authentication\n\n### Overview\n\n* **Client-side**: Stores a session identifier in a cookie.\n* **Server-side**: Tracks session state using memory, disk, or external stores like Redis.\n\n### Common Issues\n\n* **Memory Overhead**: The server must manage growing session state as more users authenticate. While external stores reduce memory usage, they increase I/O and network load.\n* **Scalability**: Synchronizing sessions across a distributed server environment introduces complexity and potential bottlenecks.\n* **Cross-Domain Limitations**: Session cookies are bound to a single domain and cannot easily be shared between subdomains or different origins.\n* **Security Risks**: Sessions are vulnerable to:\n\n  * **XSS (Cross-Site Scripting)** – attackers can steal cookies.\n  * **CSRF (Cross-Site Request Forgery)** – malicious sites trick browsers into making authenticated requests.\n\nMitigation strategies include setting the `HttpOnly`, `Secure`, and `SameSite` flags on cookies and using CSRF tokens.\n\n---\n\n## 2. Token-Based Authentication (Stateless)\n\n### Overview\n\n* **Client-side**: Stores access tokens in localStorage or cookies.\n* **Server-side**: Verifies the token on each request without tracking session state.\n\nThis model is scalable and well-suited for modern SPAs and microservices.\n\n### Advantages\n\n* Stateless architecture reduces backend load.\n* Easily supports horizontal scaling across services or servers.\n* Decouples authentication from server memory or persistence.\n\n---\n\n### JSON Web Tokens (JWTs)\n\nA JWT consists of three base64-encoded parts:\n\n```\n\u003cHeader\u003e.\u003cPayload\u003e.\u003cSignature\u003e\n```\n\n**Example:**\n\n```\neyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\n.\neyJ1c2VySWQiOiIxMjM0NTY3ODkwIiwiaWF0IjoxNjQzNTY4MjQwfQ\n.\nSflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c\n```\n\n* **Header**: Defines algorithm (e.g., HS256).\n* **Payload**: Contains claims like `userId`, `exp`, `scope`.\n* **Signature**: Verifies token integrity.\n\n\u003e Note: JWTs are base64-encoded, not encrypted. Anyone with access to a JWT can read its contents unless encryption (JWE) is used.\n\n---\n\n### Refresh Tokens\n\nRefresh tokens enable the issuance of new access tokens without re-authentication.\n\n**Best practices:**\n\n* Store securely in `httpOnly`, `Secure` cookies.\n* Rotate and expire refresh tokens after use or inactivity.\n* Maintain a revocation list for stolen or expired tokens.\n\n---\n\n## 3. Two-Factor Authentication (2FA)\n\n2FA enhances security by requiring a second factor beyond the password.\n\n### Flow\n\n1. User enters username and password.\n2. Server prompts for a second factor:\n\n   * OTP via SMS/email\n   * TOTP from an authenticator app\n   * Hardware-generated PIN (e.g., YubiKey)\n3. Upon successful validation, the user receives an access token or session.\n\n---\n\n## 4. Local Storage vs Cookies\n\n### Local Storage\n\n**Pros**\n\n* Not sent with every request → immune to CSRF.\n* Simple JavaScript API (`localStorage.getItem()`).\n* Larger storage limit (\\~5–10MB).\n\n**Cons**\n\n* Vulnerable to XSS (JavaScript-accessible).\n* No built-in expiry or invalidation.\n* Cannot be used in SSR (data unavailable at initial request).\n* Manual logic needed to attach tokens to each request.\n\n---\n\n### Cookies\n\n**Pros**\n\n* Automatically sent with each HTTP request.\n* Works well with server-side rendering (SSR).\n* Supports `HttpOnly`, `Secure`, `SameSite` flags for security.\n* Built-in expiration support.\n* Domain/path scoping.\n\n**Cons**\n\n* Vulnerable to CSRF unless mitigated.\n* Harder to parse manually in JS.\n* Limited in storage capacity (\\~4KB total).\n\n---\n\n## 5. Secure Cookie Configuration\n\nUse proper flags when setting cookies:\n\n```\nSet-Cookie: token=abc123; HttpOnly; Secure; SameSite=Strict; Path=/; Expires=Wed, 01 Jan 2030 00:00:00 GMT\n```\n\n* **HttpOnly**: Not accessible via JavaScript.\n* **Secure**: Only sent over HTTPS.\n* **SameSite=Strict**: Blocks cross-site requests.\n* **Path/Domain**: Scopes the cookie.\n\n---\n\n## 6. OAuth 2.0 and OpenID Connect\n\nToken-based systems often leverage **OAuth 2.0** and **OpenID Connect**.\n\n### Common Flows\n\n* **Authorization Code Flow (with PKCE)**: For SPAs and mobile apps.\n* **Client Credentials Flow**: For machine-to-machine APIs.\n* **Refresh Token Flow**: For long-lived sessions.\n\nThese protocols provide a standardized, secure way to authenticate users across platforms.\n\n---\n\n## 7. Best Practices\n\n| Area                    | Recommendation                                           |\n| ----------------------- | -------------------------------------------------------- |\n| Token storage           | Use `httpOnly` cookies, avoid localStorage for secrets   |\n| Access token expiration | Use short-lived tokens (5–15 mins)                       |\n| Refresh token security  | Store securely, rotate frequently                        |\n| CSRF mitigation         | Use SameSite cookies or CSRF tokens                      |\n| XSS prevention          | Sanitize inputs and use a strong Content Security Policy |\n| Cookie security         | Always use `Secure`, `HttpOnly`, and `SameSite` flags    |\n| JWT validation          | Verify signature and expiration on every request         |\n\n---\n\n## 8. Real-World Examples\n\n* **Google**: Uses OAuth 2.0 and `httpOnly` cookies for refresh tokens.\n* **GitHub**: Uses personal access tokens and OAuth apps.\n* **AWS**: Uses temporary credentials managed via session tokens and federated roles.\n\n---\n\n## 9. Conclusion\n\nChoosing the right authentication strategy depends on your app’s architecture, scale, and user experience goals:\n\n* Use **sessions** for traditional SSR apps with centralized state.\n* Use **tokens (JWT)** for SPAs, mobile apps, and scalable APIs.\n* Prefer **cookies** (with `HttpOnly`) for security-critical tokens.\n* Store **refresh tokens** securely and manage revocation or rotation.\n* Layer with **2FA** for improved account protection.\n* Always implement **CSRF and XSS defenses** regardless of the method.\n\nSecurity is a continuous effort—design defensively, monitor actively, and adapt quickly.\n"])</script><script>self.__next_f.push([1,"27:T2ce6,"])</script><script>self.__next_f.push([1,"## Introduction\n\nSuccessful software delivery requires more than coding expertise. It demands strategic coordination, resource alignment, risk control, and stakeholder communication across the full project lifecycle. Recognizing this, the *Guide to the Software Engineering Body of Knowledge* (SWEBOK) defines **Software Engineering Management** as a core discipline essential to effective and sustainable software engineering.\n\nThis guide presents a comprehensive interpretation of Software Engineering Management as outlined in SWEBOK. It expands each phase with modern methodologies, industry practices, and practical insights relevant to today’s fast-paced engineering environments.\n\n---\n\n## What Is Software Engineering Management?\n\nSoftware Engineering Management is the application of management techniques—including planning, monitoring, controlling, and reporting—to software projects. It ensures engineering initiatives are delivered:\n\n- Efficiently (with minimal waste)\n- Effectively (with high quality)\n- In alignment with business and stakeholder goals\n\nImportantly, this discipline is **lifecycle-agnostic**—it applies to Agile, Waterfall, hybrid, and DevOps methodologies alike. Whether launching a greenfield product or maintaining a complex legacy system, software engineering management ensures that objectives are clearly defined and responsibly delivered.\n\n---\n\n## 1. Initiation and Scope Definition\n\nThe foundation of every successful software project lies in a well-defined scope and a feasible plan of execution.\n\n### Determination and Negotiation of Requirements\n\nRequirements gathering is not just a technical task—it’s a facilitative process that aligns diverse perspectives. This includes:\n\n- Collaborating with stakeholders to capture both functional and non-functional needs\n- Documenting clear, testable, and traceable requirements\n- Managing trade-offs between features, budget, and timeline\n\nRobust requirements prevent downstream confusion and rework.\n\n### Feasibility Analysis\n\nBefore committing resources, evaluate feasibility from multiple dimensions:\n\n- **Technical**: Can existing systems support the solution?\n- **Financial**: Are projected costs aligned with expected returns?\n- **Operational**: Is the team prepared to build and maintain the system?\n- **Legal/Social**: Are compliance or ethical concerns involved?\n\nFeasibility analysis protects organizations from investing in unsustainable solutions.\n\n### Requirements Review and Change Management\n\nSWEBOK emphasizes structured review processes to:\n\n- Align all stakeholders on what’s being delivered\n- Identify ambiguities or contradictions\n- Establish a mechanism to evaluate and manage requirement changes\n\nThis approach supports agility without sacrificing discipline.\n\n---\n\n## 2. Software Project Planning\n\nPlanning translates a vision into a practical roadmap, allowing teams to allocate resources, forecast challenges, and track progress.\n\n### Process Planning\n\nSelect an appropriate methodology for the context:\n\n- **Agile/Scrum** for adaptive environments\n- **Waterfall** for tightly regulated or scope-stable projects\n- **Hybrid** for combining predictable milestones with iterative delivery\n\nClearly define development stages, reviews, and delivery cadence.\n\n### Deliverables and Documentation\n\nExplicitly define what the project will produce:\n\n- Source code and APIs\n- Design documents and user manuals\n- Compliance reports and support materials\n\nAlign deliverables with both internal teams and external obligations.\n\n### Effort, Schedule, and Cost Estimation\n\n| Method                     | Description                                           | Best Used When                                |\n|----------------------------|-------------------------------------------------------|-----------------------------------------------|\n| Expert Judgment            | Based on team or SME experience                      | Projects with few historical comparables      |\n| Historical Data Extrapolation | Uses past project metrics                          | Teams with a history of similar work          |\n| Algorithmic Models (e.g., COCOMO) | Estimation based on formulas and size metrics | Large or complex systems with defined scope   |\n| Agile Story Points         | Estimates effort using relative sizing               | Agile teams with iterative development cycles |\n\nRe-estimation is critical as more information becomes available.\n\n### Resource Allocation\n\nPlan how people, time, and technology will be used. Consider:\n\n- Team size, experience, and availability\n- Cross-team dependencies\n- Budgetary constraints and tooling\n\nEffective allocation reduces bottlenecks and overextension.\n\n### Risk Management\n\nMitigate uncertainty with a structured risk strategy:\n\n- Maintain a dynamic risk register\n- Quantify risks by likelihood and impact\n- Plan for mitigation (e.g., backups, alternate vendors, slack time)\n\nProactive risk planning is essential in complex or mission-critical systems.\n\n### Quality Management\n\nQuality should be embedded into every stage, not treated as an afterthought. Define:\n\n- Testing strategies (unit, integration, system, UAT)\n- Code review workflows\n- Acceptance criteria for features\n\nContinuous quality assurance aligns development with stakeholder expectations.\n\n### Plan Management\n\nA static plan becomes obsolete quickly. Use plan management practices to:\n\n- Monitor actual progress against projections\n- Revise plans based on new risks or requirements\n- Communicate changes to all stakeholders\n\n---\n\n## 3. Software Project Enactment\n\nWith the plan approved, project enactment focuses on execution, monitoring, and adaptation.\n\n### Implementation of the Plan\n\nLaunch development using structured workflows. Foster transparency through:\n\n- Sprint boards\n- Daily standups\n- Pair programming and cross-functional check-ins\n\nExecution should be continuously aligned with quality, scope, and timelines.\n\n### Software Acquisition and Vendor Management\n\nWhere third-party software or services are involved:\n\n- Establish clear vendor evaluation criteria\n- Draft detailed contracts and service level agreements (SLAs)\n- Monitor performance, cost, and risk exposure throughout the contract\n\nPoor vendor management can introduce technical debt and hidden costs.\n\n### Measurement Process Implementation\n\nTracking key indicators gives early visibility into issues. Measure:\n\n- Lead time from requirement to deployment\n- Bug frequency and severity\n- Test coverage\n- Deployment frequency\n\nDefine thresholds to trigger corrective actions.\n\n### Monitoring and Control\n\nControl mechanisms compare actual performance against the plan. Use:\n\n- Dashboards and automated reports\n- Earned value analysis\n- Retrospectives and feedback loops\n\nMonitoring ensures accountability and supports course correction.\n\n### Reporting\n\nStakeholders require clear, regular updates. Reporting should cover:\n\n- Progress vs. roadmap\n- Resource consumption\n- Identified risks and mitigation steps\n- Delivery outlook\n\nEffective communication builds confidence and facilitates support.\n\n---\n\n## 4. Review and Evaluation\n\nBefore closure, it’s critical to reflect and assess the project's outcomes.\n\n### Requirement Satisfaction Review\n\nVerify that:\n\n- All mandatory requirements are met\n- Any deviations are documented and approved\n- System testing confirms functionality and performance\n\nTraceability matrices can ensure complete coverage.\n\n### Performance Evaluation\n\nAssess the team’s effectiveness in terms of:\n\n- Delivery speed and quality\n- Budget compliance\n- Team morale and collaboration\n\nThese insights inform future project improvements and team development.\n\n---\n\n## 5. Project Closure\n\nProject closure formalizes delivery and unlocks long-term value.\n\n### Closure Determination\n\nEnsure all:\n\n- Requirements have been addressed\n- Deliverables are accepted\n- Issues are resolved or formally transitioned\n\nSign-off signifies the end of execution and the beginning of operational ownership.\n\n### Closure Activities\n\nPost-project activities include:\n\n### Closure Activities\n\n| Activity Type          | Actions                                                   | Purpose                                        |\n|------------------------|------------------------------------------------------------|------------------------------------------------|\n| Administrative         | Archive documents, finalize budgets                        | Ensure traceability and compliance             |\n| Team-related           | Release resources, reassign team members                   | Transition individuals to new projects         |\n| Knowledge Capture      | Conduct retrospectives, publish lessons learned            | Support organizational learning                |\n| Handover \u0026 Support     | Transition system ownership, set up operational monitoring | Maintain continuity post-delivery              |\n\nThis creates institutional knowledge and reinforces best practices.\n\n---\n\n## 6. Software Engineering Measurement\n\nMeasurement is central to continuous improvement.\n\n### Building a Measurement Culture\n\nTo institutionalize measurement:\n\n- Promote leadership advocacy for data-driven decisions\n- Align metrics with business goals\n- Provide teams with tools and training\n\nWithout cultural support, metrics become superficial.\n\n### Planning the Measurement Process\n\nDecide which indicators matter and how to collect them:\n\n- Operational: response time, uptime\n- Quality: defect density, rework effort\n- Productivity: cycle time, velocity\n- Satisfaction: NPS, stakeholder surveys\n\nAvoid vanity metrics. Focus on actionable insights.\n\n### Executing and Evaluating Measurements\n\nAnalyze data in real-time or through periodic reviews. Use:\n\n- Dashboards and KPIs for teams and leadership\n- Retrospectives to identify trends\n- A/B testing for new process changes\n\nInsights from measurement should directly inform improvement cycles.\n\n---\n\n### Common Software Management Tools\n\n| Category             | Tools                                 | Purpose                                      |\n|----------------------|----------------------------------------|----------------------------------------------|\n| Project Tracking     | Jira, Trello, Microsoft Project        | Sprint boards, Gantt charts, backlog mgmt.   |\n| Risk Management      | Risk Register, Confluence              | Documenting, tracking, and reporting risks   |\n| Communication        | Slack, Microsoft Teams, Zoom           | Internal messaging, meetings, collaboration  |\n| Monitoring \u0026 Metrics | SonarQube, Grafana, Datadog            | Code quality, infrastructure, and analytics  |\n\n---\n\n## Conclusion\n\nSoftware Engineering Management is the structured orchestration of people, process, and technology to consistently deliver value through software. The SWEBOK framework provides a solid foundation, but its relevance grows when adapted to the realities of modern development environments.\n\nBy blending traditional principles with Agile thinking, real-time data, and continuous improvement, engineering leaders can create resilient systems, empowered teams, and trusted stakeholder relationships. In a world where software is core to business success, mastering software engineering management is no longer optional—it is a strategic imperative.\n\n---\n\n## Reference\n\n[Software Engineering Course (SWEBOK) | IEEE Computer Society (2021)](https://www.computer.org/education/bodies-of-knowledge/software-engineering)\n"])</script><script>self.__next_f.push([1,"28:T1395,"])</script><script>self.__next_f.push([1,"## Angular is consisted of six parts:\n\n- Data Binding\n- Directive (There are three kinds of directives in Angular)\n- Components — directives with a template.\n    - are the most common of the three directives\n  - Artribuite Directive\n    - change the appearance or behaviour of an element, component, or another directive.\n  - Structural Directive\n    - change the DOM layout by adding and removing DOM elements.\n    - i.e. iterator for components\n- Forms\n  - Template-driven forms\n  - Reactive form\n- Pipe\n  - Applying data tranformation\n- Service\n  - Using Provider to apply Dependency Injection for service\n- Module\n  - Root module\n  - Feature modules\n\n## Design pattern\n\n- NgRx is using Observable pattern\n- Unidirectional Data Flow ( this is no really two way data-binding in angular 2)\n- Dependency intejection\n\n## Module\n\n_imports_ This property is used to import the modules that are required by the classes in the modules.\n_providers_ This property is used to define the module’s providers. When the feature module is\nloaded, the set of providers are combined wit
