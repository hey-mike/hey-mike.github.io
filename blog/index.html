",\"static/chunks/140-71dd7bb902becc9b.js\",\"831\",\"static/chunks/app/blog/page-e966619c8c81e784.js\"],\"default\"]\n12:I[4140,[\"950\",\"static/chunks/950-288bbdfb4f085609.js\",\"298\",\"static/chunks/298-7d4136f15270c2e1.js\",\"609\",\"static/chunks/609-6d7a31efd706c5eb.js\",\"700\",\"static/chunks/700-90fe45fc7677a939.js\",\"140\",\"static/chunks/140-71dd7bb902becc9b.js\",\"831\",\"static/chunks/app/blog/page-e966619c8c81e784.js\"],\"default\"]\n13:I[8141,[\"950\",\"static/chunks/950-288bbdfb4f085609.js\",\"298\",\"static/chunks/298-7d4136f15270c2e1.js\",\"609\",\"static/chunks/609-6d7a31efd706c5eb.js\",\"700\",\"static/chunks/700-90fe45fc7677a939.js\",\"140\",\"static/chunks/140-71dd7bb902becc9b.js\",\"831\",\"static/chunks/app/blog/page-e966619c8c81e784.js\"],\"default\"]\n14:T1920,"])</script><script>self.__next_f.push([1,"In the previouse post, i have discussed about the foundational principles like **separation of concerns**, **modularity**, and **loose coupling**. Now in Part 2, we explore **software architecture patterns**—proven structural blueprints that bring these principles to life.\n\nArchitecture patterns help you organize large systems for **scalability, changeability, testability**, and **deployment agility**. Choosing the right pattern depends on your system’s complexity, scale, and team structure.\n\n---\n\n## 1. Layered (N-Tier) Architecture\n\n**Overview**: One of the most traditional and widely adopted patterns. Responsibilities are separated into horizontal layers.\n\n### Common Layers:\n- **Presentation Layer**: Handles UI or API input/output\n- **Business Logic Layer**: Contains domain logic and rules\n- **Data Access Layer**: Manages persistence and database interactions\n\n### ✅ Pros:\n- Easy to understand and test\n- Clear separation of concerns\n- Good for monoliths and CRUD-heavy systems\n\n### ❌ Cons:\n- Changes ripple across layers\n- Difficult to scale parts independently\n- Can lead to “anemic domain models”\n\n**When to use**: Enterprise web apps, internal admin tools, legacy refactors\n\n---\n\n## 2. Hexagonal Architecture (Ports and Adapters)\n\n**Overview**: Also called “Ports and Adapters,” this pattern isolates the **core business logic** from the external world (UI, DB, network).\n\n### Structure:\n- **Core (Application + Domain logic)** at the center\n- **Ports**: Interfaces for external services (e.g., repository, messaging)\n- **Adapters**: Implement those interfaces (e.g., HTTP controllers, database clients)\n\n### ✅ Pros:\n- Very testable and maintainable\n- Easy to replace external technologies\n- Business logic is truly isolated\n\n### ❌ Cons:\n- Learning curve for juniors\n- More upfront design required\n\n**When to use**: Complex business rules, DDD, domain isolation\n\n---\n\n## 3. Microservices Architecture\n\n**Overview**: Breaks applications into **independently deployable services** that own their own data and responsibility.\n\n### Characteristics:\n- Services communicate via HTTP, gRPC, or messaging (e.g., Kafka)\n- Often aligned with bounded contexts in DDD\n- Supports polyglot persistence and tech stacks\n\n### ✅ Pros:\n- Horizontal scalability\n- Independent deployment\n- Encourages team autonomy\n\n### ❌ Cons:\n- Distributed system complexity (monitoring, debugging)\n- Data consistency challenges\n- DevOps maturity required\n\n**When to use**: Large teams, global scale, multi-product platforms\n\n---\n\n## 4. Event-Driven Architecture\n\n**Overview**: Components communicate via **asynchronous events**. Publishers emit events, and subscribers react to them.\n\n### Two types:\n- **Event Notification**: “Something happened” (e.g., user_created)\n- **Event-Carried State Transfer**: Events include relevant data\n\n### ✅ Pros:\n- Loose coupling between services\n- Supports real-time updates and reactive systems\n- Enables eventual consistency and high throughput\n\n### ❌ Cons:\n- Debugging and tracing flows is harder\n- Risk of data duplication\n- Requires strong observability tooling\n\n**When to use**: Systems requiring high decoupling, data pipelines, real-time processing\n\n---\n\n## 5. Microkernel (Plugin) Architecture\n\n**Overview**: Core system functionality is minimal and extensible through **plugins** or **extensions**.\n\n### Example:\n- IDEs like VS Code or IntelliJ\n- Content management systems (CMS)\n\n### ✅ Pros:\n- Highly flexible and extensible\n- New features don’t require touching the core\n\n### ❌ Cons:\n- Plugin management overhead\n- Versioning and interface stability needed\n\n**When to use**: Product platforms, extensible tools, SDK-based systems\n\n---\n\n## 6. Service-Oriented Architecture (SOA)\n\n**Overview**: A predecessor to microservices, SOA involves services communicating over a **service bus** or enterprise integration layer.\n\n### Differences from Microservices:\n| Feature              | SOA                             | Microservices                      |\n|----------------------|----------------------------------|-------------------------------------|\n| Communication        | Centralized ESB                  | Lightweight protocols (REST, gRPC) |\n| Data Ownership       | Shared databases                 | Private databases                   |\n| Deployment           | Often coarse-grained services    | Smaller, independently deployable   |\n\n**When to use**: Large enterprises with legacy investments or cross-system workflows\n\n---\n\n## Pattern Comparison Table\n\n| Pattern             | Scalability | Testability | Modularity | Complexity | Best For                          |\n|---------------------|-------------|-------------|------------|------------|-----------------------------------|\n| Layered             | Medium      | High        | Low        | Low        | Web apps, enterprise back-office  |\n| Hexagonal           | High        | Very High   | High       | Medium     | Domain-heavy apps                 |\n| Microservices       | Very High   | Medium      | Very High  | High       | Large, fast-moving teams          |\n| Event-Driven        | High        | Medium      | High       | High       | Real-time systems, integrations   |\n| Microkernel         | Medium      | High        | Very High  | Medium     | Plugin platforms, developer tools |\n| SOA                 | Medium      | Low         | Medium     | High       | Legacy enterprise integration     |\n\n---\n\n## Choosing the Right Architecture Pattern\n\n**There is no “one-size-fits-all” architecture.** Choose based on:\n\n- **Team size and skill**: Microservices require DevOps maturity\n- **System complexity**: Use modular or hexagonal for long-lived domain complexity\n- **Change frequency**: Event-driven patterns adapt well to evolving workflows\n- **Deployment needs**: If you need independent scaling, consider microservices or microkernel\n\n---\n\n## Final Thoughts\n\nArchitecture patterns are **tools, not destinations**. The best systems evolve by mixing and adapting patterns over time.\n\nStart simple. Prioritize modularity and observability. And always remember: **good architecture makes change easy**.\n\n---\n\n## Further Reading\n\n- *Software Architecture Patterns* – Mark Richards  \n- *Building Microservices* – Sam Newman  \n- *Domain-Driven Design* – Eric Evans  \n- *Enterprise Integration Patterns* – Gregor Hohpe, Bobby Woolf  \n- *Reactive Design Patterns* – Roland Kuhn  \n"])</script><script>self.__next_f.push([1,"15:T1b62,"])</script><script>self.__next_f.push([1,"Modern software systems must evolve quickly, scale efficiently, and remain maintainable under continuous delivery pressure. Solid software architecture isn't about using the latest frameworks—it's about applying **timeless principles** that enable systems to grow, adapt, and perform under real-world conditions.\n\nThis guide outlines the **key software architecture principles** every engineering leader should understand to build scalable, maintainable, and resilient systems.\n\n---\n\n## 1. Separation of Concerns (SoC)\n\n**Definition**: Each module, component, or layer in a system should have a **single, well-defined responsibility**.\n\n**Why it matters**: Mixing unrelated concerns leads to tightly coupled code that’s difficult to change, test, or scale.\n\n**Examples**:\n- Presentation logic should be separate from business logic\n- Authentication should be handled independently of data storage\n\n**Related Pattern**: Layered architecture (e.g., Controller → Service → Repository)\n\n---\n\n## 2. Modularity and High Cohesion\n\n- **Modularity**: Break systems into independent components or services  \n- **High Cohesion**: Each component should be focused and internally consistent\n\n**Benefits**:\n- Improves team autonomy (services owned by squads)\n- Facilitates independent development, testing, and deployment\n\n**Applied In**:\n- Microservices\n- Plugin-based monoliths\n- Feature modules in frontend apps (e.g., React or Angular)\n\n---\n\n## 3. Loose Coupling\n\n**Definition**: Minimize dependencies between components so they can evolve independently.\n\n**Why it matters**: Tightly coupled systems break easily when a single component changes.\n\n**How to implement**:\n- Use interfaces and dependency injection\n- Decouple communication with message queues (e.g., Kafka, RabbitMQ)\n- Use event-driven or API-driven communication patterns\n\n---\n\n## 4. Encapsulation and Information Hiding\n\n**Definition**: Internal details of a module or service should not be visible or accessible to others.\n\n**Benefits**:\n- Prevents unintended dependencies\n- Reduces ripple effects when internal changes occur\n\n**Examples**:\n- Expose only necessary API endpoints\n- Hide database schema details behind repositories\n\n---\n\n## 5. Scalability (Horizontal \u003e Vertical)\n\n**Scalability Principle**: Design for horizontal scalability—**scale out** by adding more nodes rather than scaling up a single machine.\n\n**How to support it**:\n- Stateless services\n- Load balancing\n- Distributed data storage (e.g., sharding, partitioning)\n\n**Considerations**:\n- Use autoscaling in cloud environments\n- Design for eventual consistency where needed\n\n---\n\n## 6. Resilience and Fault Tolerance\n\n**Definition**: Systems should gracefully handle partial failures.\n\n**Techniques**:\n- Retry patterns with exponential backoff\n- Circuit breakers (e.g., Hystrix, Resilience4j)\n- Bulkheads to isolate failures\n\n**Tools**: AWS Auto Recovery, Kubernetes Pod Health Checks, Chaos Engineering (e.g., Chaos Monkey)\n\n---\n\n## 7. Consistency vs. Availability (CAP Theorem)\n\nIn distributed systems, you must trade off **Consistency**, **Availability**, or **Partition Tolerance**.\n\n| Scenario                        | Preferred Strategy       |\n|---------------------------------|--------------------------|\n| Financial systems               | Favor consistency (e.g., ACID)  |\n| Real-time user interactions     | Favor availability (e.g., eventual consistency) |\n\n**Design Tip**: Make trade-offs explicit. Use tools like **event sourcing**, **SAGA patterns**, or **CRDTs** to balance concerns.\n\n---\n\n## 8. Single Responsibility Principle (Architectural Level)\n\nJust like at the code level, each **service or module** should be responsible for one domain or capability.\n\n**Examples**:\n- Auth Service → authentication and authorization\n- Notification Service → email, SMS, push\n\nThis aligns with Domain-Driven Design (DDD) and promotes **bounded contexts**.\n\n---\n\n## 9. Observability and Monitoring\n\n**Definition**: Architect systems to be **observable by design**, not as an afterthought.\n\n**Best Practices**:\n- Emit structured logs, metrics, and traces\n- Centralize telemetry using tools like Prometheus, Grafana, or OpenTelemetry\n- Expose health endpoints (e.g., `/health`, `/metrics`)\n\n**Why it matters**: You can’t scale, secure, or troubleshoot what you can’t see.\n\n---\n\n## 10. Evolutionary Architecture\n\n**Definition**: Design architecture to **support incremental change** without rewriting the system.\n\n**How to do it**:\n- Use feature flags\n- Design for versioning in APIs\n- Decouple components so they can be swapped or scaled independently\n\n**Goal**: Systems evolve **gracefully** alongside user needs and business growth.\n\n---\n\n## Summary Table\n\n| Principle                      | Purpose                                          | Example                             |\n|-------------------------------|--------------------------------------------------|-------------------------------------|\n| Separation of Concerns (SoC)  | Isolate responsibilities                        | UI logic separate from DB access    |\n| Modularity + High Cohesion    | Focused, interchangeable components             | Microservices or plugin architecture|\n| Loose Coupling                | Isolate change impact                           | API interfaces, message queues      |\n| Encapsulation                 | Hide internal logic                             | Expose services via interfaces only |\n| Scalability                   | Handle load by distributing services            | Stateless REST APIs on k8s          |\n| Resilience                    | Survive failures without crashing               | Circuit breakers, retries           |\n| CAP Trade-offs                | Balance consistency, availability, partitioning | Choose based on business needs      |\n| SRP (Architectural)           | One function per module                         | Separate Auth, Billing, User services|\n| Observability                 | Make systems measurable                         | Logs, metrics, distributed tracing  |\n| Evolutionary Design           | Support safe, gradual change                    | Feature flags, API versioning       |\n\n---\n\n## Conclusion\n\nSoftware architecture isn't just about picking a pattern—it's about applying principles that make your systems **scalable**, **resilient**, and **easy to evolve**.\n\nBy consistently applying these principles, you create systems that:\n\n- Scale horizontally with growing demand  \n- Handle failure gracefully  \n- Remain understandable even as teams and complexity grow  \n- Enable faster delivery without compromising on quality\n\nInvesting in architectural principles today pays off in **team velocity, product stability, and long-term agility**.\n\n---\n\n## Further Reading\n\n- *Software Architecture: The Hard Parts* – Neal Ford, Mark Richards  \n- *Clean Architecture* – Robert C. Martin  \n- *Building Microservices* – Sam Newman  \n- *The Twelve-Factor App* – Heroku  \n- *Domain-Driven Design* – Eric Evans  \n"])</script><script>self.__next_f.push([1,"16:T2221,"])</script><script>self.__next_f.push([1,"Infrastructure as Code (IaC) is a core practice of modern DevOps and cloud engineering. It enables you to **provision, configure, manage, and decommission infrastructure** entirely through code—making infrastructure versionable, testable, and repeatable just like application software.\n\nIn this post, you'll learn the categories of IaC tools, common deployment patterns, benefits, best practices, and how IaC fits into cloud-native and scalable system design.\n\n---\n\n## What Is Infrastructure as Code?\n\nTraditionally, infrastructure setup involved manually clicking through web UIs, writing wiki documentation, and hoping someone remembered how the last environment was configured. This process is:\n\n- Error-prone\n- Non-reproducible\n- Undocumented\n- Impossible to version-control or audit\n\n**IaC solves this** by defining infrastructure in code—whether declarative (`.tf`, `.yaml`) or imperative (`.sh`, `.py`)—so that environments can be built, destroyed, and rebuilt **automatically, consistently, and safely.**\n\n---\n\n## Categories of IaC Tools\n\n### 1. **Ad Hoc Scripts**\n\nQuick automation via shell or scripting languages (e.g., **Bash**, **Python**, **Ruby**) is the simplest form of IaC.\n\n**Use cases**:\n- One-off bootstrapping of dev VMs\n- Cron jobs and backups\n- Custom remote install scripts\n\n**Limitations**:\n- Not idempotent\n- Not reusable or testable\n- Hard to scale\n\nAd hoc scripts are helpful for small tasks but are not sustainable for complex infrastructure.\n\n---\n\n### 2. **Configuration Management Tools**\n\nThese tools **ensure infrastructure components are installed, configured, and kept in a desired state**.\n\n| Tool       | Language       | Notable Features                             |\n|------------|----------------|-----------------------------------------------|\n| Ansible    | YAML + Python  | Agentless, idempotent, widely adopted         |\n| Puppet     | DSL            | Agent-based, declarative                     |\n| Chef       | Ruby DSL       | Imperative, flexible                         |\n| SaltStack  | YAML + Python  | High-speed parallel execution                |\n\n**Common use cases**:\n- Install and configure NGINX or MySQL\n- Apply consistent OS settings\n- Patch and update across thousands of servers\n\n---\n\n### 3. **Server Templating and Containerization**\n\nInstead of installing software each time a VM starts, you can **bake everything into a base image**.\n\n| Tool       | Purpose                                  |\n|------------|------------------------------------------|\n| Packer     | Build AMIs or base machine images         |\n| Vagrant    | Dev-focused VM provisioning               |\n| Docker     | Package apps + dependencies into containers|\n\n**Example**:\n```json\n{\n  \"builders\": [{\n    \"type\": \"amazon-ebs\",\n    \"ami_name\": \"myapp-base-image\",\n    \"instance_type\": \"t2.micro\",\n    \"source_ami\": \"ami-0c55b159cbfafe1f0\"\n  }]\n}\n````\n\nUse **Docker** to build application images and **Packer** to generate cloud-optimized base images with Docker preinstalled.\n\n---\n\n### 4. **Immutable Infrastructure**\n\nWith **immutable infrastructure**, once a server is deployed, it is **never modified** in place. Instead, any change requires creating a new image and redeploying.\n\n**Advantages**:\n\n* Prevents config drift\n* Easier rollback (just switch AMIs)\n* Safer deployment (fewer unknowns)\n\n**Common approach**:\n\n* Use Packer to create AMI\n* Deploy via Terraform\n* Blue/green or canary rollout via Kubernetes or ECS\n\n---\n\n### 5. **Provisioning Tools**\n\nThese tools define and deploy infrastructure components (network, compute, databases, storage) via code.\n\n| Tool               | Highlights                                      |\n| ------------------ | ----------------------------------------------- |\n| Terraform          | Multi-cloud, declarative, modular               |\n| AWS CloudFormation | Native AWS IaC, YAML/JSON based                 |\n| Pulumi             | IaC with general-purpose languages (TS, Python) |\n\n**Terraform Example**:\n\n```hcl\nresource \"aws_instance\" \"web\" {\n  ami           = \"ami-0c55b159cbfafe1f0\"\n  instance_type = \"t3.micro\"\n}\n```\n\nThese tools work well with **GitOps** and CI/CD workflows to deliver environments on demand.\n\n---\n\n### 6. **Orchestration Tools**\n\nOnce infrastructure is provisioned and containers built, orchestration ensures the apps are running **at scale and with resilience**.\n\n| Tool         | Key Role                                  |\n| ------------ | ----------------------------------------- |\n| Kubernetes   | Cluster-level orchestration of containers |\n| Amazon ECS   | AWS-managed orchestration                 |\n| Nomad        | Lightweight multi-platform orchestrator   |\n| Docker Swarm | Simpler native Docker orchestration       |\n\n**Kubernetes Features**:\n\n* Declarative YAML\n* Auto-healing (restart failed pods)\n* Auto-scaling\n* Rolling deployments and blue/green support\n* Built-in service discovery\n\n**Example: Kubernetes Deployment**\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: myapp\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: myapp\n  template:\n    metadata:\n      labels:\n        app: myapp\n    spec:\n      containers:\n      - name: myapp\n        image: myapp:v1\n        ports:\n        - containerPort: 8080\n```\n\n---\n\n## IaC Deployment Patterns\n\n| Pattern                | Description                                         | Tools Involved                           |\n| ---------------------- | --------------------------------------------------- | ---------------------------------------- |\n| Immutable Deployments  | Recreate infra instead of mutating                  | Packer, Terraform, Kubernetes            |\n| GitOps                 | Infra changes are Git-triggered                     | Terraform + GitHub Actions, ArgoCD       |\n| Blue/Green Deployments | Swap old/new environments for zero-downtime rollout | Load balancer + Terraform + Orchestrator |\n| Infrastructure Modules | Reusable templates across environments              | Terraform modules, CloudFormation stacks |\n\n---\n\n## Best Practices for IaC\n\n1. **Use version control** for all infrastructure code (Git)\n2. **Validate syntax and format** using linters (e.g., `tflint`, `ansible-lint`)\n3. **Use automated testing** (`Terratest`, `kitchen-terraform`, `inspec`)\n4. **Avoid hardcoded secrets**; use Vault, AWS Secrets Manager, or SSM\n5. **Tag and label all resources** for cost tracking and organization\n6. **Design for idempotency**—running the code twice shouldn’t cause errors\n7. **Modularize** your code (e.g., Terraform modules per service or team)\n8. **Use CI/CD** for deploying infrastructure safely and consistently\n9. **Document workflows and architecture** alongside code\n\n---\n\n## Security and Compliance in IaC (Optional but Important)\n\n* **Static Analysis Tools**: tfsec, Checkov, KICS\n* **Drift Detection**: Terraform plan vs. actual state\n* **Policy as Code**: Use OPA (Open Policy Agent) or Sentinel to enforce rules\n* **Secrets Management**: Never store secrets in Git—use encrypted backends\n\n---\n\n## Benefits of Infrastructure as Code\n\n| Benefit              | Description                                                               |\n| -------------------- | ------------------------------------------------------------------------- |\n| Speed \u0026 Efficiency   | Faster, automated provisioning across environments                        |\n| Consistency          | Prevents human error and config drift                                     |\n| Reusability          | Define once, reuse everywhere (e.g., staging, prod, dev)                  |\n| Visibility           | Infra changes are logged, reviewed, and auditable                         |\n| Recovery             | Rebuild environments from scratch with minimal effort                     |\n| Collaboration        | Developers and ops teams can share and collaborate on infra logic         |\n| Testing \u0026 Validation | Use test frameworks and Git-based workflows to ensure correctness         |\n| Self-service         | Teams can deploy their own infra without ticket queues or ops bottlenecks |\n\n---\n\n## Conclusion\n\nInfrastructure as Code enables you to **treat infrastructure as software**, applying the same principles of version control, automation, testing, and reuse to build stable, scalable systems.\n\nWhether you're managing a single cloud application or deploying hundreds of microservices globally, IaC gives you the tools and discipline to stay **fast, safe, and resilient**.\n\n---\n\n## Further Reading\n\n* *Terraform: Up \u0026 Running* – Yevgeniy Brikman\n* *Infrastructure as Code* – Kief Morris\n* *Kubernetes: Up \u0026 Running* – Brendan Burns, Joe Beda\n* *The Phoenix Project* – Gene Kim, Kevin Behr, George Spafford\n"])</script><script>self.__next_f.push([1,"17:T1f25,"])</script><script>self.__next_f.push([1,"## Introduction\n\nTraditional software deployment processes are often manual, slow, and prone to error. As application architectures and teams scale, the pain of pushing changes to production intensifies—leading to bottlenecks, reduced quality, and mounting technical debt.\n\nTo address these challenges, many organizations have embraced **DevOps**: a set of practices, principles, and cultural norms that emphasize collaboration between development and operations teams. At its core, DevOps aims to streamline the **software development lifecycle (SDLC)** and deliver software quickly, reliably, and safely.\n\n---\n\n## The Problem with Snowflake Servers\n\nLegacy infrastructure is typically managed manually. Over time, inconsistent updates and ad hoc changes lead to configuration drift—where no two servers are the same. These unique, hard-to-replicate environments are known as **\"snowflake servers.\"**\n\n### Common issues include:\n\n- Inability to reproduce production bugs in staging or dev environments  \n- Unreliable scaling due to inconsistent infrastructure  \n- Increased risk during deployments and disaster recovery\n\n### Solution: Infrastructure as Code (IaC)\n\nDevOps addresses this through **Infrastructure as Code**—defining and provisioning infrastructure using machine-readable code. Tools like Terraform, CloudFormation, and Pulumi help teams version, test, and deploy infrastructure predictably.\n\n---\n\n## What Is DevOps?\n\nGartner defines DevOps as:\n\n\u003e “A change in IT culture, focusing on rapid IT service delivery through the adoption of agile, lean practices in the context of a system-oriented approach. DevOps emphasizes people (and culture), and seeks to improve collaboration between operations and development teams.”\n\n### In Practice, DevOps Is:\n\n- A **mindset** focused on transparency, collaboration, and iteration  \n- A **practice** that emphasizes automation, fast feedback, and continuous delivery  \n- A **culture** of shared ownership, system thinking, and customer-centric outcomes\n\nThe primary goal of DevOps is to accelerate delivery without sacrificing quality, by creating a **high-trust, low-friction environment** where change is safe and fast.\n\n---\n\n## The CAMS Model: Pillars of DevOps\n\nOne of the most widely recognized DevOps frameworks is **CAMS**, which outlines four foundational pillars:\n\n| Pillar      | Description                                                                                   | Tools \u0026 Examples                          |\n|-------------|-----------------------------------------------------------------------------------------------|-------------------------------------------|\n| Culture     | Trust, collaboration, blameless retrospectives, shared responsibility                         | Cross-functional teams, postmortems       |\n| Automation  | CI/CD, infrastructure provisioning, testing, compliance                                        | Jenkins, GitHub Actions, Terraform        |\n| Measurement | Data-driven decisions using metrics like deployment frequency, MTTR, and change failure rate | Grafana, Prometheus, Datadog              |\n| Sharing     | Open communication, knowledge sharing, documentation, reusable scripts and playbooks          | Wikis, runbooks, Slack channels           |\n\nThis model reinforces the idea that DevOps is not just about tooling—**people and process** matter most.\n\n---\n\n## Cargo Cult DevOps: A Common Pitfall\n\nA **cargo cult** occurs when organizations copy surface-level behaviors of successful teams—without understanding the rationale behind them.\n\n### Example:\n\n\u003e A company adopts Kubernetes because large tech firms use it—despite lacking the scale, expertise, or needs for container orchestration.\n\n### How to Avoid This Trap:\n\n- Focus on solving **your specific problems**, not mimicking trends  \n- Ask **why** a practice exists before implementing it  \n- Prioritize context over convention—DevOps is not one-size-fits-all\n\nSustainable DevOps success requires **intentional, fit-for-purpose decision-making**.\n\n---\n\n## How DevOps Works: Core Practices\n\n### 1. Collaboration\n\n- Break down silos between Dev, Ops, QA, and Security  \n- Foster shared accountability for uptime, performance, and delivery  \n- Use rituals like daily standups, retrospectives, and joint planning\n\n### 2. Continuous Integration (CI)\n\n- Developers integrate code into a shared repository frequently  \n- Automated builds and tests run with every commit  \n- Catch issues early to reduce integration risks\n\n**Common Tools**: GitHub Actions, CircleCI, GitLab CI\n\n### 3. Continuous Delivery (CD)\n\n- Code is always in a deployable state  \n- Releases can be pushed to production safely and on demand  \n- Requires strong test automation and confidence in the pipeline\n\n### 4. Continuous Deployment\n\n- Every passing build is automatically deployed to production  \n- Enables rapid iteration and short feedback cycles  \n- Requires observability, rollbacks, and feature toggles\n\n### 5. Continuous Monitoring\n\n- Real-time observability into applications and infrastructure  \n- Track availability, latency, error rates, and usage patterns  \n- Alert teams to potential failures before they impact users\n\n### 6. Automation Everywhere\n\n- Extend automation to compliance, security checks, infrastructure, and testing  \n- Treat everything as code: infrastructure, policy, and documentation  \n- Reduce manual intervention and operational toil\n\n---\n\n## A Modern DevOps Toolchain\n\nHere’s a breakdown of commonly used tools across categories in modern DevOps pipelines:\n\n| Category               | Popular Tools                                            |\n|------------------------|----------------------------------------------------------|\n| Version Control        | Git, GitHub, GitLab, Bitbucket                           |\n| CI/CD Pipelines        | Jenkins, GitHub Actions, GitLab CI/CD, Argo CD           |\n| Infrastructure as Code | Terraform, AWS CDK, Pulumi, CloudFormation               |\n| Config Management      | Ansible, Chef, Puppet                                    |\n| Containers             | Docker, Podman                                           |\n| Orchestration          | Kubernetes, Amazon ECS, Nomad                            |\n| Monitoring \u0026 Logging   | Prometheus, Grafana, ELK Stack, Datadog, New Relic       |\n| Collaboration          | Slack, Jira, Confluence, Notion                          |\n\n**Note**: Tooling is only effective when integrated thoughtfully into your team’s workflow.\n\n---\n\n## DevOps by the Numbers\n\nThe 2021 [DORA State of DevOps Report](https://cloud.google.com/devops/state-of-devops) reveals the transformative impact of mature DevOps practices:\n\n| Metric                         | Elite Teams vs. Low Performers |\n|-------------------------------|--------------------------------|\n| Deployment Frequency          | 973x more frequent             |\n| Lead Time for Changes         | 6570x faster                   |\n| Change Failure Rate           | 3x lower                       |\n| Time to Restore Service (MTTR)| 6570x faster                   |\n\nThese numbers aren't just technical wins—they drive **business agility, reliability, and customer satisfaction**.\n\n---\n\n## Conclusion\n\nDevOps is a fundamental shift in how teams build, deliver, and operate software. It's not just a technical solution—it's a cultural and strategic movement that aligns development and operations around shared goals.\n\nTo succeed:\n\n- Start small, then scale  \n- Focus on culture before tools  \n- Automate wisely  \n- Continuously learn and adapt  \n\nOrganizations that fully embrace DevOps unlock faster innovation, reduced operational risk, and more resilient systems.\n\n---\n\n## Further Reading\n\n- *The Phoenix Project* – Gene Kim, Kevin Behr, George Spafford  \n- *Accelerate: Building and Scaling High Performing Technology Organizations* – Nicole Forsgren, Jez Humble, Gene Kim  \n- *Site Reliability Engineering* – Google SRE Team  \n"])</script><script>self.__next_f.push([1,"18:T1cf7,"])</script><script>self.__next_f.push([1,"# Rethinking Delivery Performance: Lessons from DORA 2023 and Developer Experience\n\nIn 2023, the DevOps Research and Assessment (DORA) team released its latest *State of DevOps* report, highlighting the evolving landscape of software delivery. The findings were clear: high-performing teams aren’t just faster—they’re safer, more resilient, and more developer-friendly.\n\nAs engineering leaders, it's time we stop treating performance as just a speed game. Modern software delivery is a balance of **velocity**, **reliability**, and **developer experience**.\n\nThis post reframes key engineering metrics through the lens of **DORA 2023**—and introduces a few complementary metrics that expose the hidden friction in your pipeline.\n\n---\n\n## The Core Five: DORA 2023 Metrics\n\nThese metrics form the foundation of performance analysis in elite engineering organizations.\n\n### 1. Lead Time for Changes  \n**Definition**: Time from code committed to code successfully running in production.\n\nThis reflects the speed of innovation and feedback loops. DORA 2023 reaffirms it as one of the strongest indicators of delivery performance.\n\n- **What to track**: Time from PR creation to successful deployment\n- **Why it matters**: Long lead times discourage iteration, delay feedback, and frustrate teams\n\n**2023 Benchmark**:\n- Elite: \u003c1 hour  \n- Low: \u003e6 months\n\n### 2. Deployment Frequency  \n**Definition**: How often your team deploys code to production.\n\nThis measures how continuously you can deliver value. Frequent deploys typically correlate with small batch sizes, less risk, and healthier teams.\n\n- **What to track**: Daily or weekly prod/staging deployments per team\n- **Why it matters**: High deployment frequency enables fast fixes, feature flags, and continuous validation\n\n**2023 Benchmark**:\n- Elite: Multiple times per day  \n- Low: Fewer than once every 6 months\n\n### 3. Change Failure Rate  \n**Definition**: The percentage of deployments causing degraded service, bugs, or rollbacks.\n\nThis represents the **cost of change**. DORA teams emphasize failure rate as a critical counterbalance to deployment speed.\n\n- **What to track**: Failed deployments / total deployments\n- **Why it matters**: High rates indicate poor test quality, integration issues, or insufficient validation\n\n**2023 Benchmark**:\n- Elite: 0–15%  \n- Low: 46–60%\n\n### 4. Mean Time to Recovery (MTTR)  \n**Definition**: Time from incident detection to full restoration of service.\n\nFailures happen. What matters is how quickly you can detect, diagnose, and recover.\n\n- **What to track**: Incident start to incident resolution\n- **Why it matters**: Fast MTTR builds trust in your system and your team\n\n**2023 Benchmark**:\n- Elite: \u003c1 hour  \n- Low: \u003e6 months\n\n### 5. Reliability  \n**Definition**: The degree to which your system meets operational expectations (uptime, latency, etc.).\n\nAdded in recent years, **reliability** reflects customer-facing system health, not just internal delivery metrics.\n\n- **What to track**: SLAs, SLOs, incident frequency, alert fatigue\n- **Why it matters**: A fast pipeline is meaningless if your system is down or unstable\n\n---\n## Summary of DORA 2023 Core Metrics\n\n| Metric                 | Definition                                                | What to Track                            | Elite Benchmark         |\n|------------------------|------------------------------------------------------------|------------------------------------------|-------------------------|\n| Lead Time for Changes  | Time from commit to production                             | PR open to prod deploy                   | \u003c 1 hour                |\n| Deployment Frequency   | How often code is deployed to prod                         | Prod deploys per day/week                | Multiple times per day  |\n| Change Failure Rate    | % of deployments causing incidents                         | Failed/rolled-back deployments           | 0–15%                   |\n| Mean Time to Recovery  | Time to restore service after failure                      | Time from incident to resolution         | \u003c 1 hour                |\n| Reliability            | System’s ability to meet uptime and performance expectations| SLOs, uptime, incident rate              | SLO-compliant \u0026 stable  |\n\n## Beyond DORA: Metrics That Capture Developer Experience\n\nWhile DORA gives us delivery health, it doesn’t tell the whole story. Developer Experience (DevEx) has emerged as a critical success factor—and these supporting metrics help illuminate it.\n\n### 6. Build Time  \n**Definition**: Time to compile, test, and package a change.\n\nWhile not in DORA, build time directly affects lead time and developer flow. Long builds waste time, reduce confidence in the CI system, and lead to risky batch commits.\n\n- **What to track**: CI job duration (cold and hot builds)\n- **Why it matters**: Developers won’t iterate quickly if builds punish them for trying\n\n**Tip**: Watch for variance—flaky builds are worse than slow ones.\n\n---\n\n### 7. Queue Time  \n**Definition**: Time a CI/CD job waits before it starts executing.\n\nThis is the **invisible bottleneck** in scaling engineering teams. When everyone’s building at once, even the best pipelines slow down.\n\n- **What to track**: Time from job submission to execution start\n- **Why it matters**: Queue time reflects infrastructure limits and resource contention\n\n**Insight**: DORA emphasizes speed, but speed can’t happen when runners are exhausted.\n\n---\n\n### 8. Frequency of Broken Main  \n**Definition**: How often the main branch is in a non-deployable state.\n\nThis is a culture and process smell. A consistently broken main branch means poor test coverage, weak gating, or rushed reviews.\n\n- **What to track**: % of time main is red / incident count from merges\n- **Why it matters**: Main should be sacred. If you can’t trust it, everything slows down.\n\n**Actionable Tip**: Set up merge protection, fast revert paths, and daily \"green checks\".\n\n---\n\n### 9. Engineering Overhead  \n**Definition**: Time engineers spend on infra, CI tooling, and environment management instead of feature development.\n\nThis metric ties directly to **platform maturity** and **DevEx quality**—themes DORA 2023 heavily emphasizes.\n\n- **What to track**: % of sprint hours spent on pipeline bugs, test flakiness, tooling fixes\n- **Why it matters**: Engineers drowning in overhead are engineers not shipping value\n\n**How to measure**: Use retros, dev satisfaction surveys, or tag internal tickets. Patterns emerge quickly.\n\n---\n\n## Closing Thoughts: DORA + DevEx Is the Future\n\nDORA’s metrics provide a science-backed foundation for measuring delivery performance. But they’re not the end of the story.\n\nIn 2023, DORA explicitly emphasized:\n- **Developer Experience (DevEx)**\n- **Platform engineering**\n- **Psychological safety**\n- **Sustainable delivery culture**\n\nTo build elite teams, you must **measure what matters and remove what hurts**. That includes invisible friction: long waits, flaky builds, overloaded tools, and broken feedback loops.\n\nYour goal isn’t just faster code—it’s a **system that enables developers to move confidently, safely, and joyfully**.\n\nThat’s real velocity.\n\n---\n\n**References**:\n- [2023 State of DevOps Report – DORA](https://cloud.google.com/devops/state-of-devops)\n- *Accelerate: The Science of Lean Software and DevOps* by Forsgren, Humble, and Kim\n"])</script><script>self.__next_f.push([1,"19:T1aa5,"])</script><script>self.__next_f.push([1,"# Introduction\n\n\u003e “Clean code is code that is easy to understand and easy to change.” – Robert C. Martin\n\nAs software projects grow in size and complexity, the ability to read, reason about, and safely change code becomes critical. Clean code isn’t just aesthetically pleasing—it’s essential for maintainability, collaboration, scalability, and long-term success.\n\nThis post explores **clean code** and the most influential **software design principles** that help developers reduce complexity and build systems that stand the test of time.\n\n---\n\n## What Is Clean Code?\n\nClean code refers to code that:\n\n- Is **readable** and clearly expresses its intent\n- Is **simple** in structure and function\n- Has minimal duplication\n- Is **modular**, making it easy to test and extend\n- Is **predictable** and consistent in style and logic\n\nWhen code is clean, developers can onboard faster, fix bugs with confidence, and make changes without fear of breaking unrelated parts of the system.\n\n---\n\n## Why Design Principles Matter\n\nSoftware design principles are not rules—they are **guidelines** that help you write clean, testable, and maintainable code. They make it easier to:\n\n- Understand logic in large codebases  \n- Avoid introducing bugs during changes  \n- Reuse and extend functionality without rewriting everything  \n- Reduce onboarding time for new developers  \n\nWell-applied design principles **scale with your system** and reduce cognitive overhead for everyone involved.\n\n---\n\n## SOLID: The Foundation of Object-Oriented Design\n\nThe **SOLID** principles are a set of five foundational rules introduced by Robert C. Martin to improve object-oriented software design. They support modularity, encapsulation, and long-term flexibility.\n\n| Principle                     | Purpose                                                  | Key Idea                                              |\n|-------------------------------|-----------------------------------------------------------|--------------------------------------------------------|\n| Single Responsibility         | Maintain separation of concerns                          | A class should have only one reason to change         |\n| Open/Closed                   | Enable safe extension                                     | Open for extension, closed for modification           |\n| Liskov Substitution           | Promote polymorphism integrity                           | Subclasses should be substitutable for base classes   |\n| Interface Segregation         | Avoid bloated interfaces                                 | Prefer small, client-specific interfaces              |\n| Dependency Inversion          | Decouple modules                                         | Depend on abstractions, not concrete implementations  |\n\n### 1. Single Responsibility Principle (SRP)\n\n\u003e “There should never be more than one reason for a class to change.”\n\nThis principle encourages developers to keep **each class focused on a single task**. Mixing unrelated responsibilities in one class increases coupling and reduces maintainability.\n\n### 2. Open–Closed Principle (OCP)\n\n\u003e “Software entities should be open for extension, but closed for modification.”\n\nInstead of changing existing code to add functionality, use **inheritance** or **composition** to extend behavior. This reduces the risk of breaking stable code.\n\n### 3. Liskov Substitution Principle (LSP)\n\n\u003e “Objects in a program should be replaceable with instances of their subtypes without altering the correctness of that program.”\n\nLSP ensures that **child classes remain behaviorally consistent** with their parent classes, supporting polymorphism and robust abstractions.\n\n### 4. Interface Segregation Principle (ISP)\n\n\u003e “Many client-specific interfaces are better than one general-purpose interface.”\n\nThis principle discourages designing large, generic interfaces that force classes to implement unused methods. Instead, **break interfaces into role-specific contracts**.\n\n### 5. Dependency Inversion Principle (DIP)\n\n\u003e “Depend upon abstractions, not concretions.”\n\nHigh-level modules should not depend on low-level ones directly. Both should depend on **shared abstractions** (like interfaces), enabling better modularity and testability.\n\n---\n\n## DRY Principle: Don’t Repeat Yourself\n\nThe **DRY** principle aims to eliminate **duplication of logic, data, and structure**. Repeating the same patterns leads to inconsistencies and bloated codebases.\n\n\u003e “Every piece of knowledge must have a single, unambiguous, authoritative representation within a system.” – Andy Hunt \u0026 Dave Thomas, *The Pragmatic Programmer*\n\n### Examples of DRY in Practice:\n\n- Centralizing shared logic in **utility classes or helper functions**\n- Using **inheritance or composition** for shared behavior\n- Normalizing data structures in database design\n\nAvoiding duplication **improves maintainability** and minimizes the risk of bugs during updates.\n\n---\n\n## KISS Principle: Keep It Simple, Stupid\n\nThe **KISS** principle emphasizes that systems should be as **simple as possible**. Over-engineering adds unnecessary complexity and reduces clarity.\n\n\u003e “Simplicity is the ultimate sophistication.” – Leonardo da Vinci\n\n### Guidelines for KISS:\n\n- Favor **clear logic** over clever tricks  \n- Write short, modular functions  \n- Avoid premature optimization  \n- Use design patterns only when truly needed  \n\nCode simplicity often correlates with **fewer bugs and faster onboarding**.\n\n---\n\n## YAGNI Principle: You Aren’t Gonna Need It\n\nThe **YAGNI** principle is rooted in agile and extreme programming (XP) practices. It advises against building features **before they are truly required**.\n\n\u003e “Always implement things when you actually need them, never when you just foresee that you need them.” – Ron Jeffries, XP co-founder\n\nBuilding speculative features adds maintenance overhead, increases code complexity, and often leads to waste. YAGNI promotes **just-in-time design** and a strong focus on delivering immediate business value.\n\n---\n\n## Conclusion\n\nClean code isn’t a goal—it’s a process. By following principles like **SOLID, DRY, KISS, and YAGNI**, you create a codebase that:\n\n- Evolves without becoming brittle  \n- Enables fast onboarding and easy debugging  \n- Encourages reuse and automation  \n- Adapts to change without fear\n\nGreat software is not just about functionality—it’s about sustainability. These principles give you the architectural foundation to build systems that last.\n\n---\n\n## Further Reading\n\n- *Clean Code* – Robert C. Martin  \n- *The Pragmatic Programmer* – Andy Hunt and Dave Thomas  \n- *Agile Software Development* – Robert C. Martin  \n- *Design Patterns: Elements of Reusable Object-Oriented Software* – Erich Gamma et al.  \n"])</script><script>self.__next_f.push([1,"1a:T1bd2,"])</script><script>self.__next_f.push([1,"## Introduction\n\nEffective software testing is a foundational part of modern engineering. With complex applications and distributed systems, it’s essential to apply the right type of test to the right scenario—ensuring quality, reliability, and resilience at every level.\n\nIn this guide, we explore six core types of tests, from traditional unit tests to advanced monkey testing. We’ll explain their differences, where to apply them, and what pitfalls to avoid.\n\n---\n\n## Unit Testing\n\nUnit testing verifies the **smallest testable components** of a program, such as individual functions or methods. The goal is to ensure that a specific unit of logic behaves as expected in isolation.\n\n### Key Characteristics\n\n- Fast execution\n- Focuses on business logic, not infrastructure\n- Written and maintained by developers\n- Easy to run during development or CI pipelines\n\n### Challenge: Testability\n\nA major barrier to unit testing is code that is **not modular or testable**. Functions tightly coupled to external systems (like databases or APIs) are difficult to test effectively.\n\n### Solution: Use Mocks\n\nWhen unit testing code that interacts with external systems, use **mocking** to isolate the unit:\n\n- Replace database access or API calls with mock objects\n- Control the return values to simulate different scenarios\n- Prevent external dependencies from affecting test results\n\nThis isolation ensures unit tests are **deterministic**, repeatable, and fast.\n\n---\n\n## Integration Testing\n\nIntegration tests validate how multiple components or systems work together. Unlike unit tests, integration tests verify the flow across different parts of the system—like services, databases, and APIs.\n\n### Characteristics\n\n- Covers multiple units or modules\n- May involve real or stubbed infrastructure\n- Ensures correctness of communication and integration logic\n\n### In Microservices\n\nIntegration testing is especially important in **microservice architectures**. A single flow may traverse several services, requiring coordinated data exchange and interface compatibility.\n\nFor example, an integration test could validate:\n\n- Authentication → API Gateway → Order Service → Database  \n- API call from Service A → Kafka Topic → Service B processing\n\n---\n\n## End-to-End (E2E) Testing\n\nEnd-to-end tests verify the **entire application workflow** from the user’s perspective. These tests cover full business flows across services, infrastructure, and the UI.\n\n### Purpose\n\n- Ensure that **end-to-end business scenarios** function correctly\n- Detect failures caused by misaligned services, regressions, or UI issues\n\n### Example E2E Flow:\n\n1. Register a new user  \n2. Create news articles across categories (e.g., politics, sports)  \n3. Search for news using cookies/session state  \n4. Validate that recommendations reflect expected behavior\n\n### Difference from Integration Testing\n\nWhile both test across systems:\n\n| Feature           | Integration Test                   | End-to-End Test                       |\n|-------------------|-------------------------------------|---------------------------------------|\n| Focus             | System interactions (internal flow) | Full business process (user-focused) |\n| Interfaces        | APIs, services, databases           | UI, APIs, databases                   |\n| Speed             | Faster                              | Slower                                |\n\n---\n\n## Signature Testing\n\nIn distributed microservice systems, services communicate using structured **payloads or contracts**, often referred to as **service signatures**.\n\n### The Problem\n\nWhen one team changes the structure of a service’s payload (e.g., removes a field), other dependent services may break—even if they weren’t informed.\n\n### Signature Tests Detect:\n\n- Schema violations\n- Incompatible payload changes\n- Backward-incompatible version upgrades\n\n### Best Practices\n\n- Implement **contract testing** (e.g., with Pact or Spring Cloud Contract)\n- Use schema validation and versioning\n- Automate tests to run before deployment in CI/CD\n\nThis testing ensures inter-team coordination and avoids production regressions from undocumented interface changes.\n\n---\n\n## Monkey Testing\n\nMonkey testing introduces **randomized input or conditions** to identify unexpected failures or weak spots in an application.\n\nIt is particularly useful for:\n\n- Testing input validation  \n- Finding performance bottlenecks under chaotic conditions  \n- Exposing edge-case failures not covered by structured tests\n\n---\n\n### Chaos Monkey and the Simian Army\n\nOriginally developed by Netflix, **Chaos Monkey** intentionally disrupts systems in production to validate their resilience. It belongs to a broader set of tools called the **Simian Army**, which includes:\n\n| Tool              | Description                                                                 |\n|-------------------|-----------------------------------------------------------------------------|\n| Chaos Monkey      | Randomly terminates instances to test fault tolerance                       |\n| Chaos Gorilla     | Simulates loss of an entire availability zone                               |\n| Conformity Monkey | Terminates non-compliant resources (e.g., untagged EC2 instances)           |\n| Doctor Monkey     | Checks system health (CPU, memory, disk) and removes unhealthy instances    |\n| Janitor Monkey    | Identifies and removes unused resources to reduce cost                      |\n| Latency Monkey    | Adds artificial network latency to simulate degraded performance            |\n| Security Monkey   | Identifies security misconfigurations (e.g., open ports, weak credentials)  |\n\nThese tools test how systems behave **under stress, degradation, or attack**, strengthening infrastructure for real-world reliability.\n\n---\n\n## Conclusion\n\nEach type of test plays a critical role in building reliable software systems:\n\n| Test Type         | Scope                        | Goal                                     | Who Uses It             |\n|-------------------|------------------------------|------------------------------------------|--------------------------|\n| Unit Test         | Individual functions/methods | Validate isolated logic                  | Developers               |\n| Integration Test  | Multiple components/services | Ensure systems interact as intended      | Developers, QA           |\n| End-to-End Test   | Full application workflows   | Confirm end-user functionality           | QA, Test Automation Team |\n| Signature Test    | API/service contracts        | Prevent breaking changes in integrations | DevOps, SRE, Developers  |\n| Monkey Test       | System chaos/random input    | Discover unexpected errors               | QA, SRE, Platform Teams  |\n\nChoosing the right testing strategy—and applying it consistently—helps teams detect defects early, reduce production incidents, and ship with confidence.\n\n---\n\n## Further Reading\n\n- *Test-Driven Development: By Example* – Kent Beck  \n- *Building Microservices* – Sam Newman  \n- *Chaos Engineering* – Casey Rosenthal, Nora Jones  \n"])</script><script>self.__next_f.push([1,"1b:T1f7b,"])</script><script>self.__next_f.push([1,"## Communicate Child to Parent\n\nSince there is no way to communicate between siblings (only\nparent to child and vice versa), keeping the state at the root\nof the hierarchy is the best strategy.\n\n## Spread Operator\n\n\"spread\" operator to pass the whole props object.\n\n```JSX\nfunction App1() {\n  return \u003cGreeting firstName=\"Ben\" lastName=\"Hector\" /\u003e;\n}\n\nfunction App2() {\n  const props = {firstName: 'Ben', lastName: 'Hector'};\n  return \u003cGreeting {...props} /\u003e;\n}\n```\n\n## Object rest spread (Redux example)\n\nhttp://redux.js.org/docs/recipes/UsingObjectSpreadOperator.html\n\n## Required module as default\n\n- Create a index.js module\n- improt A from './folder_name'\n\n## React Router\n\n`withRouter` will cause rerender if enable it in `Route`, it has bo be used when export component.\n\n## Fragment\n\nA common pattern in React is for a component to return multiple elements. Fragments let you group a list of children without adding extra nodes to the DOM.\n\n## Using the state\n\n1. We should always keep in mind that only the minimal amount of data needed should be put into the state\n1. We should add to the state only the values that we want to update when an event happens, and for which we want to make the component re-render.\n\n## Should component update\n\n1. Dont' duplicate data from props in state, calculate what you can in render() method\n1. Don't keep something in the state if you don't use it for rendering, For example, API subscriptions are better off as custom private fields or variables in external modules.\n\n## Container and Presentational pattern\n\n`Container components`\n\n- They are more concerned about the behavior\n- They render their presentational components\n- They make API calls and manipulate data\n- They define event handlers\n- They are written as classes\n\n`Presentational components`\n\n- They are more concerned with the visual representation\n- They render the HTML markup (or other components)\n- They receive data from the parents in the form of props\n- They are often written as stateless functional components\n\n## Function as Child\n\n```React\nconst FunctionAsChild = ({ children }) =\u003e children()\n\nFunctionAsChild.propTypes = {\n  children: React.PropTypes.func.isRequired,\n}\n```\n\n## Uncontrolled Components\n\nwhere we do not set the value of the input field, but we let the component manage its internal state.\n\n## Controlled Components\n\nWe have full control over the value of the fields\n\n## Event\n\n- Synthetic Event\n\nA Synthetic Event is an object that wraps the original event object provided by the browser, and it has the same properties, no matter the browser where it is created.\n\n- single global handler\n- event bubbling: What it does instead is attach a single event handler to the root element, which listens to all the events,\n- single global handler : When an event we are interested in is fired by the browser, React calls the handler on the specific components on its behalf.\n\n## Server side rendering\n\n- SEO :One of the main reasons we may want to render our applications on the server-side is Search Engine Optimization (SEO).\n- A common code base: We do not have many options on the client: our applications have to be written in JavaScript. There are some languages that can be converted into JavaScript at build time, but the concept does not change.\n- Better performance:we all love client-side applications, because they are fast and responsive, but there is a problem: the bundle has to be loaded and run before users can take any action on the application.\n\n`SSR or not`\n\n- If your page is non-interactive don't render it in the browser (Only render the page to HTML on the server.) (Not only is computational time saved by skipping rendering to the DOM but also load time is saved by skipping loading JavaScript code.)\n\n- If your page is non-interactive and doesn't change on every request, then render it on the server at build-time.\n\n- The SSR should be enabled on when strictly needed. For example, if you need SEO or if you need to customize the social sharing information, you should start thinking about it.\n\n- If you realize that your application takes a lot of time to fully load and you have already done all the optimization (see the following chapter for more about this topic), you can consider using server-side rendering to offer a better experience to your users and improve the perceived speed.\n\n## Optimization\n\n- Webpack UglifyJsPlugin\n\n- Should component update\n\n- PurComponent\n\nA PureComponent will always re-render if the state or props reference a new object. This implies that if we do not want to lose the benefits of PureComponent, we should avoid such structures:\n\n```React\n\u003cEntity values={this.props.values || []}/\u003e\n```\n\nIt is important to remember, that PureComponent skips the re-render operation not only for component itself, but also for all its children, so the best use case for PureComponent are presentational components which have no child components and no dependencies on the global state in the application.\n\n- Stateless functional components: Another concept that is sometimes counter-intuitive for beginners is the fact that stateless components do not give us any benefits regarding performance.\n\n## Testing\n\nThere are generally two ways of testing React components, by:\n\n- Shallow rendering\n- Mounting the components into a detached DOM\n\nBefore starting, it is important to have a clear idea about what we want to test and why.\nThe following list represents more or less all the variations and functionalities of the component that are worth testing:\n\n- The state is initialized with the value coming from the props\n- The placeholder prop is correctly used in the element\n- The right class names are applied following the conditional logic\n- The state is updated whenever the value of the field changes\n- The onSave callback is fired according to the different states and conditions\n\n`Snapshot Testing`: Snapshots are pictures of the component with some props at a given point in time. Every time we run the tests, Jest creates new pictures and it compares them with the previous ones to check if something has changed, and It shows us what's changed in the current snapshot.\n\n`Test coverage`: in some scenarios it is useful to get some measurement of the coverage and keep track of the numbers. In big projects with many different modules, doing so makes it easy to spot files that have not been adequately tested or that have not been tested at all.\n\n### Common testing solutions\n\n- Testing Higher-Order Components\n- The Page Object pattern\n\n### Error handling with React\n\nThe best thing we can do when problems happen in our applications is:\n\n- Notify the users and help them understand what happened and what they should do\n- Collect all useful information about the error and the state of the application in order to reproduce it and fix bugs quickly\n\n## Avoid Anti-pattern\n\n1. Map data key\n\n- The key has to be unique and stable, identifying one, and only one, item\n- use the value of the item if we expect it not to be repeated within the list, or create a unique identifier.\n\n1. Spreading props on DOM elements\n\n- create a prop called domProps that we can spread safely to the component because we are explicitly saying that it contains valid DOM properties\n\n## HOC\n\n`JavaScript\nimport React from 'react';\n\n// We receive a component constructor as an argument\nconst makeRed = (Component) =\u003e {\n// We make a new component constructor that takes props, just as any component\nconst wrappedComponent = (props) =\u003e {\n// This new component returns the original component, but with the style applied\nreturn (\n// But we also use the ES6 spread operator to apply the regular props passed in.\n// The spread operator applies props like the text in \u003cRedButton text=\"hello\" /\u003e\nto our new component\n// It will \"spread\" any and all props across our component\n\u003cComponent style={{ backgroundColor: 'red', color: 'white' }} {...props} /\u003e\n);\n};\n// We return the new constructor, so it can be called as \u003cRedButton /\u003e or \u003cRedAlertBox /\u003e\nreturn wrappedComponent;\n}\n\nexport default makeRed;\n`\n"])</script><script>self.__next_f.push([1,"1c:T92e,"])</script><script>self.__next_f.push([1,"## Scifit-learn\n\n**Overfitting** means that the model captures the patterns in the training data well, but fails to generalize well to unseen data.\n\n- Training data: the slited data used to build machine learning model\n- Test data: the reset of the data is used to assess how well the model words\n- In scikit-learn, data is usually denoted with a capital X, while labels are denoted by a lowercase y. This is inspired by the standard formulation f(x) = y in mathematics, where x is the input to a function and y is the output.\n- X (capital) represents two-dimensional array ( a matrix) and a lowercase y represents one-dimensioanl array (a vector)\n\n## Pair plot\n\nIt is difficult to plot datasets with more than three features, due to computer have only two dimentsions, which allows us to plot only two (or maybe three) features at a time.\nPair plot looks at all possible pairs of features\n\n## Decision Tree\n\n- **Advantages**\n  - The resulting model can easily be visulized and understood by noexperts (at least for smaller trees),.\n  - The algorithms are completely invariant to scaling of the data.\n- **Disadvantage**\n  - Even it use pre-pruning, they tend to overfit and provide poor generalization performance\n- **Ensembles of Decision Tress**\n\n## Random Forests\n\nRandom forests for regression and classification are currently among the most widely used machine learning methods.\nIt requires more memory and are slower to train and to predict than linear models, so if time and memory are important in an application, it might make sense to use a linear model instead.\n\n**n_estimators**: larger is always better.\n\n## Gradient Boosted Regression Trees\n\nGradient boosted trees are frequently the winning entries in machine learning competitions, and are widely used in industry. They are generally a bit more sensitive to parameter settings than random forests, but can provide better accuracy if the parameters are set correctly.\n\n## Kernelized Support Vector Machines\n\n## Neural Networks ( Deep Learning)\n\nAdanvatage:\nThey are able to capture information contained in large amounts of data and build incredibly complex models. Given enough computation time, data, and careful tuning of the parameters, neural networks often beat other machine learning algorithms (for classifcation and regression tasks)\n\nDisadavantage\nTake a long time to train.\n"])</script><script>self.__next_f.push([1,"1d:Ta44,"])</script><script>self.__next_f.push([1,"## Holdout cross-validation\n\nA classic and popular approach for estimating the generalization performance of machine learning models is holdout cross-validation.\n\n**Model selection**: tuning and comparing different paramenter settings to further improve the performance for making predictions on unsee data, it refers to a givent classifcation problem for which we want to select the optimal values of tunning parameters. (**Hyperparameters**)\n\nA better way of using holdout method for modle selection is to separate the data into three parts: a traning set, a validation set, and a test set.\n\nThe advantage of having a test set that the model hasn't seen before during the training and model selection steps is that we can objtain a less biased estimate of its ability to generalize to new data.\n\nA disadvantage of the holdout method is that the preformance estimate is sensitive to how we partition the training set into the training and validation subsets\n\n## K-fold cross-validation\n\nRandomly split the training dataset into k folds without replacement, wheere k - 1 folds are used for the model training and on fold is use for testing. This procedure is repeated k times so that we obtain k models and performance estimates.\n\nRandom sampling without replacement: 2, 1, 3, 4, 0\nRandom sampling with replacement: 1, 3, 3, 4, 1\n\nBenefits of cross validation:\n- each example will be in the test set exactly once\n- each example is in one of the folds, and each fold is the test set once\n- having multiple splits of data provides some information about how sensitive our model is to the selection of the traning dataset.\n- it is more effectively than train_test_split\n\nDisadvantage:\nit increase computational cost, since it trains k models instead of a single model, cross validation will be roughly k tims slower than doing a single split of data.\n\n## Debugging algorithms with learning and validation curves\n\n- Diagnosing bias and variance problems with learning curves\n- Addressing overfitting and underfitting with validation curves\n- Fine-tuning machine learning models via grid search\n- Algorithm selection with nested cross-validation\n- Looking at different performance evaluation metrics\n  - precision\n  - recall\n  - F1-score\n  - Receiver operator charateristic (ROC): this graphs are useful tools for selecting models for classification based on their performance with respect to the false positive and ture positive rates, which are computed by shifting the decision threshold of the classifer.\n  - Area under the cureve (AUC) can be computed based on ROC curve to charaterize the performance of a classification model\n"])</script><script>self.__next_f.push([1,"1e:T9fc,"])</script><script>self.__next_f.push([1,"## Ensemble learning\n\nEnsemble methods: combine different classifiers into a meta-classifier that has a better generalization performance than each individual classifier alone.\n\nExample: assuming that we collected predictions from 10 experts, ensemble methods would allow us to strategically combine these predictions by the 10 experts to come up with a prediction that is more accurate and robust than the predictions by each individual expert.\n\n- Majority voting: select the class label that has been predicted by the majority of classifiers, that is, received more than 50 percent of the votes.Strictly speaking, it refers to binary class settings only.\n- Plurality voting: select the class label that received the most votes.\n\n## Why using logistic regression and k-nearest neighbors classifier as part of pipleline?\n\nBoth algorithms(using the Euclidean distance metric) are not scale-invariant in contrast with decision trees.\n\n## Bagging ( boostrap aggregating)\n\nThe convertional baggin algorithm involves generating 'n' different boostrap training samples with replacement. And training the algorithm on each boostrapped algorithm separately and then aggregating the predictions at the end.\n\nBagging is used for reducing overfitting in order to create strong learners for generating accurate predictions. Unlike boosting, baggin allows replacement in the boostrapped sample.\n\n- Advantages\n  - Improves stability \u0026 accuracy of machine leraning algorithms\n  - Reduces variance\n  - Overcomes overfitting\n  - Improved misclassification ratre of the bagged classifier\n  - In noisy data enviroments bagging outperforms boosting\n- Disavantages\n  - Bagging works only if the base classifers are not bad to begin with. Bagging bad classifiers can further degrade performance\n\n## Adaptive Boosting (weak learner)\n\nAda Boost is the first original boosting technique which creates a highly accurate prediction rule by combining many weak and inaccurate rules. Each classifer is serially trained with the goal of correcly classifying examples in every round that were incorrectly classified in the previous round.\n\nFor a learned classifier to make strong predictions, it should follow the follwing 3 conditions:\n\n- The rules should be simple\n- Classifier should have been trained on sufficient number of training examples.\n- The classifer should have low training error for the traning instances\n\nAdvantages\n\n- Very simple to implement\n- Good generalization - suited for any kind of classification problem \n\nDisadvantages\n\n- Sensitive to noisy data and outliers\n"])</script><script>self.__next_f.push([1,"1f:T9a3,"])</script><script>self.__next_f.push([1,"\n## Collect more data\n\n## Resampling\n\nStandard classifier algorithms like Decision Tree and Logistic Regression have a bias towards classes which have number of instances. They tend to only predict the majority class data. The featueres of minority class are treated as noise and are often ignored. Thus, there is a high probability of misclassification of the nimority class as compared to the majority class.\n\n### Random under-sampling\n\n    -   Advantages: It can help improve run time and storage problems by reducing the number of training data samples when the traing data set is huge.\n    -   Disadvantages\n        -   It can discard potentially useful information which could be important for building rule classifiers.\n        -   The sample chosen by random under sampling may be a biased sample. And it will not be an accurate representative of the population. Thereby, resulting in inaccurate results with the actual test data set.\n\n### Random over-sampling\n\n    -   Advantages:\n        -   No information loss\n        -   Outerperforms under sampling\n    -   Disadvantages\n        -   It increases the likelihood of overfitting since it replicates the minority class events\n\n### Cluster-based over sampleing\n\n    -   Advantages\n        -   This clustering technique helps overcome the challenge between class imbalance. Where the number of examples representing positive class differs from the number of examples representing a negative class.\n        -   Overcome challenges within class imbalance, where a class is composed of different sub clusters. And each sub cluster does not contain the same number of examples\n    -   disadvanteges\n        -   The main drawback of this algorithm, like most oversampling techniques is the possibility of over-fitting the traning data.\n\n### Informed over sampling: synthetic minority over-sampling technique\n\n    -   Advantages\n        -   Mitigates the problem of overfitting caused by random oversampling as synthetic examples are generated rather than replication of instances\n        -   No loss of useful infomation\n    -   Disadvantages\n        -   While generating sythetic examples SMOTE does not take into consideration neighboring examples from other classes. This can result in increase in overlapping of classes and can introduce additional noise\n        -   SMOTE is not very effective for high dimensional data\n\n### Modified synthetic minority oversampling technique (MSMOTE)\n\n## Ensemble techniques\n"])</script><script>self.__next_f.push([1,"20:T6d5,## Dealling with Missing data\n\n-   Eliminating samples or feature with missing values\n    -   There are three types of missing data\n        -   Missing Completely At Random (MCAR)\n        -   Missing At Random (MAR)\n        -   Missing Not At Random (MNAR)\n    -   Missing categorical feature\n        -   KNN to predict the missing value\n        -   Fill in missing values with most frequent value\n-   Imputing missing values\n    -   Small amount value: KNN\n    -   Imputer\n-   scikit-leran estimater\n\n## Detecting outliers\n\n-   Looking as a whole: EllipticEnvelope\n-   Looking at individual feature (IQR)\n\n## Handling categorical data\n\n-   Mapping ordinal freatures\n-   Encodeing class labels\n-   Performing one-hot encoding on nominal features\n\n## Paritioning a dataset in training and test sets\n\n## Bringing features onto the same scale\n\n## Selecting meaningful features\n\n-   Sparse solutions with L1 regularization\n-   Sequential freature selection algorithms\n    -   feature slection : select a subset of the original freatures\n        -   Sequential Backward Selection (SBS) : reduce the dimensionality of the inital feature subspace with minimum decay in performance of the classifier to improve upon computational efficiency.\n    -   feature extraction : derive information from the feature set to construct a new feature subspace.\n\n## Assessing feature importance with random forests\n\n-   If two or more features are highly correlated, one feature may be ranked very highly while the information fo the other feature(s) may not be fully captured. On the other hand, we don't need to be concerned about this problem if we are merely interested in the predictive performance of a model rather than the interpretation of feature importtances.\n21:T55b,## Clustering\n\nClustering (cluser analysis) is a technique that allows us to find groups of similar objects, objects that are more related to each other than to objects in other groups.\nExaples of business-oriented applications of clustering include the grouping of documents, music,"])</script><script>self.__next_f.push([1," and moviews by different topics, or finding customers that share similar interests based on common purchase behaviors as a basis for recommendation egines.\n\n## k-means\nIt belongs to the cateory of protoype-based clustering.\n\n- Drawbacks\n  - One or more clusters can be empty\n  - we have to specify the number of clusters, k, a priori\n\n## Hard VS Soft clustering\n\nHard clustering: a family of algorithms where each sample in a dataset is assigned to exactly on cluster.\nSoft clustering: sometimes called fuzzy clustering, it assign a sample to one or more clusters.\n\n- fuzzy C-mean (FCM, also called soft k-means or fuzzy k-means).\n\n## hierachical\n\n- agglomerative\n  - single linkage\n  - complete linkage\n- divisive clustering\n\n## density-based clustering \n\nDensity-based spatial Clustering of Applications with Noice (DBSCAN)\n\nAdvantages:it does not assume that the clusters have a spherical shape as in k-means.\n\nDisadvantage: With an increasing number of features in our dataset -assuming a fixed number of training examples - the negative effect of curse of dimensionality increases.\n22:T13b8,"])</script><script>self.__next_f.push([1,"## A diagram of AI in computer science\n![Computer Science and AI](//images.contentful.com/2swoy9jddxd7/6jhGWPq3bcl01xYsb0UoGY/381dedb846a0bb91fe7ca00b53da60e7/Computer_Science.png)\n\n## Rule-based system VS Machine learning\n\n1. The logic required to make a decision is specific to a single domain and task. Changing the task even slightly might require a rewrite of the whole system.\n1. Designing rules requires a deep understanding of how a decision should be made by a human expert.\n\nMachine learning summarized in four categories.\n\n- Predictive learning: comprises two kinds of tasks where we aim to either predict a continuous valued phenomenon (like the future location of a celestial body), or distinguish between distinct kings of things (like different faces in an image)\n- Feature design: A broad set of engineering and mathematical tools which are crucial to the successful performance of predictive learning models in practice.\n- Function approximation: It is employed when we know too little abut a dataset to produce proper features ourselves (and therefore must learn them strictly from the data itself).\n- Numerical optimization  powers the first three and is the engine that makes machine learning run in practice.\n\n## Cost function\nOne of the key ingredients of supervised machine learning algorithms is to define\nan objective function that is to be optimized during the learning process. This\nobjective function is often a cost function that we want to minimize.\n\n## Predictive learning problems\n\n1. Regression:\n2. Classification: The key difference between the two is that instead of predicting a continuous-valued output (e.g., share price blood pressure, etc.), with classification what we aim at predicting takes on discrete values or classes.\n\n## Three types of machine learning\n\n- Supervised learning (making predictions about the future):\n  - **supervised** refers to a set of samples where the desired output signals (lables ) are already known.\n  - There are two sub categories:\n    - **classification**: the goal is to predict the categorical class labels of new instances based on the pas observations, which is a choice from a predfined list of possibilities.\n      - _i.e. distinguish spam and non-spam email_\n    - **regression**: for predicting continuous outcomes, given a number of _predictor_ ( explanatory) variables and a continuous response variable (outcome), and we try to find a relationship between those variables that allows us to predict an outcome.\n      - _i.e. predict a relationship between the time spent studying for the test and the final scores_\n  - examples:\n    - Identifying the ZIP code from handwritten digits on an envelope.\n    - Determining whether or not a tumor is benign based on a medical image.\n    - Detecting fraudulent activity in credit card transactions\n\nA easy way to distinguish between classifcation and regression tasks is to ask whether there is some kind of continuity in the output.\n\n- Unsupervised learning (Discovering hidden structures):\n  - In uservised learning, we know the right answer beforehand when we train our model, and in reinforcement learning, we define a measure of reward for particular actions by the agent. In unsupervised learning, however, we are dealling with unlabeled data or data of unkow structure.\n  - **cluster**: is an exploratory data analysis technique that allows us to organize a pile of information into meaningful subgroups (_clusters_) without having any prior knowledge of their group menmeberships.\n    - _i.e._ it allows marketers to discover customer groups based on their interests in order to
