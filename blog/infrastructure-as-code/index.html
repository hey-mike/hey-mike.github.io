otence*: Code that works correctly no matter how many times you run\n3. *Distribution*: Ad hoc scripts are intended to execute on a single computer. Ansible and other configuration management technologies are intended to handle a large number of remote servers.\n\n### Server templating tools\nServer templating technologies like Docker, Packer, and Vagrant have lately gained prominence as alternatives to configuration management. Instead of starting many servers and configuring them all with the same code, server templating tools generate a server image that contains a complete “snapshot” of the OS, software, files, and other important information. Then use another IaC programme to instal it on all your servers.\n\n#### Tools for working with images\n*Virtual machines*: A virtual machine (VM) simulates a complete computer system, including the hardware. With VMWare, VirtualBox, or Parallels you virtualize  the CPU, memory, hard drive, and networking.\n\n__Pros__:\nAny VM image running on top of the hypervisor can only view virtualized hardware, keeping it completely isolated from the host system and other VM images (e.g., your computer, a QA server, a production server)\n\n__Cons__:\nEach VM has its own OS, virtualizing all this hardware incurs significant cost in terms of CPU, memory, and startup time.\n\n*Cotnainers*\nA container simulate an OS's user space, then you run a container engine like Docker, CoreOS rkt, or cri-o to generate separated processes.\n\n__Pros__:\nThe advantage is that each container running on top of the container engine can only view its own user space, keeping it isolated from the host system and other containers (your computer, a QA server, a production server, etc.)\n\n__Cons__:\nThe disadvantage is that all containers on a single server share the same OS kernel and hardware, making it impossible to achieve the same degree of isolation and security as a VM. However, because the kernel and hardware are shared, containers start up in milliseconds with little CPU and memory use.\n\n#### Commom pattern\nNote that each server templating tool has a unique function. Use Packer to build images that operate directly on production servers, like an AMI in your production AWS account. Vagrant usually creates images for development machines, such a VirtualBox image for your Mac or Windows laptop. Docker is usually used to build app images.\n\nA common pattern is to use Packer to build an AMI with the Docker Engine installed, then deploying that AMI on a cluster of machines in your AWS account to execute your apps.\n\n#### Immutable infrastructure \nThis concept comes from functional programming and involves immutable variables, which means that once set, they can never be changed. Because variables don't change, they're simpler to reason about.\n\nImmutable infrastructure works similarly: once deployed, a server is never changed again. To update anything, you generate a new image from your server template and deploy it on a new server. It's simpler to reason about what's deployed since servers never change.\n\n### Orchestration tools\nIn real world, you will need the following steps to deploy the new infracturure:\n\n- Deploy VMs and containers, making efficient use of your hardware.\n- Roll out updates to an existing fleet of VMs and containers using strategies such as *rolling deployment, blue-green deployment, and canary deployment.*\n- Monitor the health of your VMs and containers and automatically replace unhealthy ones (__auto healing__).\n- Scale the number of VMs and containers up or down in response to load (__auto scaling__).\n- Distribute traffic across your VMs and containers (load balancing).\n- Allow your VMs and containers to find and talk to one another over the network (__service discovery__).\n\nOrchestration tools like *Kubernetes, Marathon/Mesos, Amazon Elastic Container Service (Amazon ECS), Docker Swarm, and Nomad* can help software engineers to easily manage the those steps with less effort.\n\nFor example, Kubernetes lets you specify container management as code. You would first set up a Kubernetes cluster, which is a collection of servers managed by Kubernetes.\n\n### Provisioning tools\nWhile configuration management, server templating, and orchestration tools specify the code that runs on each server, provisioning tools like Terraform, CloudFormation, and OpenStack Heat create the servers themselves, including database caches, load balancers, queues, monitoring, subnet configurations, firewall settings, routing rules, Secure Sockets Layer (SSL) certificates, and almost every other aspect of your infrastructure.\n\n## The Benefits of Infrastructure as Code\n1. __Self-service__: Since infrastructure is defined in code, the whole deployment process can be automated, and developers can initiate their own deployments as needed.\n2. __Speed and safety__: If the deployment process is automated, it will be considerably quicker since a computer can do the deployment stages much faster than a person; and safer because an automated process will be more consistent, repeatable, and less prone to human mistake.\n3. __Documentation__: IaC serves as documentation, enabling everyone in the company to understand how things operate even if the system administrator is away.\n4. __Version control__: Your IaC source files may be stored under version control, capturing the full history of your infrastructure in the commit log. When a problem arises, the first step is to examine the commit log to see what happened in your infrastructure, and the second is to simply rollback to a known-good version of your IaC code.\n5. __Validation__: If your infrastructure is specified in code, you may conduct code reviews, run automated tests, and analyse the code using static analysis tools after every update.\n6. __Reuse__: You can bundle your infrastructure into reusable modules so you don't have to recreate it for every product and environment.\n7. __Happiness__: Manually deploying code and maintaining infrastructure is tedious. No originality, no challenge, no acknowledgement, no reward. No one will notice if you release code flawlessly for months, unless you make a mistake. That causes tension and annoyance. Instead, IaC lets computers do what they do best (automation) and people do what they do best (development) (coding)."])</script><script>self.__next_f.push([1,"8:[[\"$\",\"$L11\",null,{}],[\"$\",\"main\",null,{\"className\":\"min-h-screen\",\"children\":[\"$\",\"$L12\",null,{\"post\":{\"contentTypeId\":\"blogPost\",\"sys\":{\"space\":{\"sys\":{\"type\":\"Link\",\"linkType\":\"Space\",\"id\":\"2swoy9jddxd7\"}},\"id\":\"5TOZqmWzzaz9TGAIEocUKV\",\"type\":\"Entry\",\"createdAt\":\"2021-09-23T01:05:34.565Z\",\"updatedAt\":\"2021-09-23T04:44:41.023Z\",\"environment\":{\"sys\":{\"id\":\"master\",\"type\":\"Link\",\"linkType\":\"Environment\"}},\"publishedVersion\":159,\"revision\":7,\"contentType\":{\"sys\":{\"type\":\"Link\",\"linkType\":\"ContentType\",\"id\":\"blogPost\"}},\"locale\":\"en-US\"},\"fields\":{\"title\":\"Infrastructure as Code\",\"slug\":\"infrastructure-as-code\",\"heroImage\":{\"metadata\":{\"tags\":[],\"concepts\":[]},\"sys\":{\"space\":{\"sys\":{\"type\":\"Link\",\"linkType\":\"Space\",\"id\":\"2swoy9jddxd7\"}},\"id\":\"119bssZxkeE51FEFgIQekD\",\"type\":\"Asset\",\"createdAt\":\"2021-09-22T22:52:18.064Z\",\"updatedAt\":\"2025-05-12T12:22:54.136Z\",\"environment\":{\"sys\":{\"id\":\"master\",\"type\":\"Link\",\"linkType\":\"Environment\"}},\"publishedVersion\":8,\"revision\":2,\"locale\":\"en-US\"},\"fields\":{\"title\":\"DevOps\",\"description\":\"DevOps\",\"file\":{\"url\":\"//images.ctfassets.net/2swoy9jddxd7/119bssZxkeE51FEFgIQekD/f8633f5db7a33a0072e9d3c44a0f5f2e/devops.png\",\"details\":{\"size\":2115839,\"image\":{\"width\":1536,\"height\":1024}},\"fileName\":\"devops.png\",\"contentType\":\"image/png\"}}},\"description\":\"Some notes of Infrastructure as Code\",\"body\":\"$13\",\"author\":{\"metadata\":{\"tags\":[],
